/* ============================================================
   15. RESULTS (§7)
============================================================ */
var renderToken=0;
function renderResults(){
  renderToken++;   /* invalidate any in-flight chunked append */
  var host=document.getElementById('results');
  clear(host);
  var C=A.cfg;

  if(!A.boot.ok)return; /* checksum banner already rendered; never show numbers */

  if(A.loading){
    host.appendChild(h('div',{class:'empty'},[h('b',{},[h('span',{class:'spin'}),' loading slate']),
      h('div',{text:A.progress||'…'})]));
    return;
  }
  if(A.slate&&A.slate.phantom){
    host.appendChild(h('div',{class:'empty'},[
      h('b',{text:SPORT_PROFILES[A.sport].label+' — coming soon'}),
      h('div',{text:'The WNBA adapter is a phantom. The BDL key must be proxied through a Netlify function before any public deploy, so no live call is made from this page. Every knob above still works and is saved under the WNBA profile.'}),
    ]));
    return;
  }
  if(!A.slate){
    host.appendChild(h('div',{class:'empty'},[h('b',{text:'no slate loaded'}),
      h('div',{text:'Pick a date and the slate fetches automatically.'})]));
    return;
  }
  if(!A.slate.games.length){
    host.appendChild(h('div',{class:'empty'},[h('b',{text:'no games on '+A.slate.date}),
      h('div',{text:'Empty slate — not an error. Try another date, or tap Today.'})]));
    return;
  }
  if(!A.scanned){
    host.appendChild(h('div',{class:'empty'},[h('b',{text:A.slate.games.length+' games cached'}),
      h('div',{text:'Assemble the query in the rail, then run it.'})]));
    return;
  }

  var rows=visibleResults();

  /* results header: count · spotlight · sort */
  var hdr=h('div',{class:'res-hdr'},[
    h('div',{class:'res-count'},[
      h('b',{text:String(rows.length)}),' cards · ',
      h('b',{text:String(rows.reduce(function(a,r){return a+r.visibleCount},0))}),' matches · ',
      h('span',{text:A.scanMs+'ms'}),
    ]),
    h('div',{class:'spot-wrap'},[
      /* re-rendering the results replaces this node, so focus + caret are
         restored afterwards — otherwise a two-digit number is untypable. */
      h('input',{class:'spot'+(A.work.spotlight?' on':''),type:'text',inputmode:'numeric',
        id:'spotInput',placeholder:'number spotlight…',value:A.work.spotlight,
        oninput:function(e){
          A.work.spotlight=e.target.value.replace(/[^0-9]/g,'');
          var caret=A.work.spotlight.length;
          saveWork();renderResults();
          var again=document.getElementById('spotInput');
          if(again){again.focus();try{again.setSelectionRange(caret,caret)}catch(err){}}
        }}),
    ]),
    h('select',{class:'spot',style:{flex:'0 0 auto',width:'auto'},onchange:function(e){
      C.sort=e.target.value;onChange(false);renderResults();
    }},[
      h('option',{value:'count',selected:C.sort==='count'?true:null,text:'Sort: match count'}),
      h('option',{value:'alpha',selected:C.sort==='alpha'?true:null,text:'Sort: lineup / A–Z'}),
      h('option',{value:'team',selected:C.sort==='team'?true:null,text:'Sort: team / game'}),
    ]),
    (function(){
      var nf=filterCount();
      return h('button',{class:'filters-btn',onclick:function(){A.sheetOpen=true;renderSheet()}},
        [h('span',{text:'Filters'}),nf?h('span',{class:'fbadge',text:String(nf)}):null]);
    })(),
  ]);
  host.appendChild(hdr);

  if(!rows.length){
    host.appendChild(h('div',{class:'empty'},[h('b',{text:'no matches'}),
      h('div',{text:'Silence is information. Widen the query — add ciphers, phrases, or stat lanes.'})]));
    return;
  }
  var grid=h('div',{class:'grid'+(C.mode==='individual'?' individual':'')});
  host.appendChild(grid);
  /* Cards are appended in CHUNKS. Nothing is filtered, capped or dropped —
     every row still renders — but a maximal query can produce a
     half-million-node DOM, and building it in one synchronous pass locks the
     tab. The first chunk paints immediately (and keeps the headless render
     test synchronous); the rest streams in on animation frames so the page
     stays interactive and Tony can start reading the top cards at once. */
  /* The chunk is a LINE budget, not a card count: at maximal settings one
     card can carry thousands of receipt lines, so "60 cards per frame" would
     still build a half-million nodes in the first pass. Always at least one
     card per frame so progress is guaranteed. */
  var BUDGET=1200;
  var idx=0;
  var emit=function(){
    var lines=0;
    while(idx<rows.length){
      grid.appendChild(renderCard(rows[idx]));
      lines+=rows[idx].visibleCount+4;
      idx++;
      if(lines>=BUDGET)break;
    }
  };
  emit();                       /* first frame is synchronous: instant paint */
  updateTray();
  if(idx<rows.length){
    var note=h('div',{class:'banner info',id:'renderNote',
      text:'rendering '+idx+' of '+rows.length+' cards…'});
    host.appendChild(note);
    var token=renderToken;
    var raf=window.requestAnimationFrame||function(f){return setTimeout(f,16)};
    var step=function(){
      if(token!==renderToken)return;          /* a newer render superseded us */
      emit();
      if(idx<rows.length){
        note.textContent='rendering '+idx+' of '+rows.length+' cards…';
        raf(step);
      }else if(note.parentNode)note.parentNode.removeChild(note);
    };
    raf(step);
  }
}

/* §7.3 in-results filtering + spotlight + sort, all recomputed from cache. */
function visibleResults(){
  var W=A.work,C=A.cfg,spot=W.spotlight?+W.spotlight:null;
  var rows=A.results.map(function(r){
    var groups=[];
    r.groups.forEach(function(g){
      var c=g.counter;
      /* FIX-1 sheet: family-level hides -- whole groups, or one stat lane */
      if(W.hiddenFamilies.indexOf(c.group)>=0)return;
      if(c.group==='stat'&&c.statKey&&W.hiddenFamilies.indexOf('stat:'+c.statKey)>=0)return;
      var hits=g.hits.filter(function(x){return W.hiddenWords.indexOf(x.entry.text)<0});
      groups.push({counter:c,hits:hits});
    });
    var count=groups.reduce(function(a,g){return a+g.hits.length},0);
    return{player:r.player,groups:groups,visibleCount:count,flags:r.flags,raw:r};
  });
  /* individual mode: one card, every counter shown even when unmatched (§7.6) */
  if(C.mode==='individual'){
    rows=rows.filter(function(r){return r.player.id===C.individualId});
    return rows;
  }
  rows=rows.filter(function(r){return r.visibleCount>0});
  if(spot!=null&&W.spotlight!==''){
    rows=rows.filter(function(r){
      return r.groups.some(function(g){
        return g.counter.value===spot||g.hits.some(function(x){return x.value===spot||x.entry.v===spot});
      });
    });
  }
  var slate=A.slate;
  rows.sort(function(a,b){
    if(C.sort==='alpha')return a.player.fullName<b.player.fullName?-1:1;
    if(C.sort==='team'){
      var ta=(slate.teams[a.player.teamId]||{}).fullName||'',tb=(slate.teams[b.player.teamId]||{}).fullName||'';
      if(ta!==tb)return ta<tb?-1:1;
      return a.player.fullName<b.player.fullName?-1:1;
    }
    if(b.visibleCount!==a.visibleCount)return b.visibleCount-a.visibleCount;
    return a.player.fullName<b.player.fullName?-1:1;
  });
  return rows;
}

/* label for receipt lines whose value is not a gematria value */
var KIND_LABEL={date:'date calc',raw:'thread #',jersey:'jersey #',age:'age figure',
  bdaySpan:'birthday span',founders:'founders span',clock:'career clock',
  entity:'entity',phrase:'phrase',compose:'composed',probe:'probe'};
/* FIX-1 section 4: every receipt line answers "what even is this". Names are
   self-evident (the quoted word IS the player's or a team's name) -- no
   suffix. Everything else names its source chain. */
var FIELD_LABEL={name:'name',founder:'founder',city:'city',nickname:'nickname',
  birthplace:'birthplace',state:'state',span:'span'};
var SELF_EVIDENT={pName:1,pFirst:1,pLast:1,tName:1,tLoc:1,tMascot:1,oName:1,oLoc:1,oMascot:1};
function provParts(e){
  if(e.kind==='entity'&&e.src){
    var ent=A.founders&&A.founders.byKey[e.src.entityKey];
    return['⚑ '+((ent&&ent.name)||'entity')+' — '+(FIELD_LABEL[e.src.field]||e.src.field),
           e.hook?'hooked: '+e.hook.why:null];
  }
  if(e.kind==='founders')return[e.hook?'hooked: '+e.hook.why:null];
  if(e.kind==='phrase')return[e.fromTheme?'theme':'custom phrase'];
  if(e.kind==='compose')return['composed phrase'];
  if(e.kind==='date')return['date calc'+(e.word||e.cipher?' · '+(e.label||''):'')];
  if(e.kind==='jersey')return['jersey'];
  if(e.kind==='raw')return['thread #'];
  if(e.kind==='age')return['age figure'];
  if(e.kind==='bdaySpan')return['birthday span'];
  if(e.kind==='clock')return['career clock'];
  if(e.kind==='probe')return['probe'];
  return SELF_EVIDENT[e.kind]?[]:[KIND_LABEL[e.kind]||e.kind];
}
function provSuffix(e){
  var parts=provParts(e).filter(Boolean);
  if(!parts.length)return null;
  return h('span',{class:'prov',text:'· '+parts.join(' · ')});
}
var GROUP_CLASS={age:'g-age',bday:'g-bday',stat:'g-stat',date:'g-date',
  founders:'g-founders',clock:'g-clock',team:'g-team'};

function renderCard(r){
  var p=r.player,C=A.cfg,slate=A.slate;
  var team=slate.teams[p.teamId]||{},opp=slate.teams[p.oppTeamId]||{};
  var game=slate.games.filter(function(g){return g.gameId===p.gameId})[0]||{};
  var card=h('div',{class:'card'});

  /* §7.1 header */
  var nm=h('div',{class:'card-name'},[
    h('span',{text:p.fullName}),
    p.isPitcher?h('span',{class:'p-mark',title:p.isProbable?'probable starter':'pitcher',
      text:p.isProbable?'P·prob':'P'}):null,
    h('span',{class:'badge',text:String(r.visibleCount)}),
  ]);
  var away=(game.away&&(game.away.abbr||game.away.fullName))||'?';
  var home=(game.home&&(game.home.abbr||game.home.fullName))||'?';
  card.appendChild(h('div',{class:'card-hd'},[nm,
    h('div',{class:'card-meta'},[
      h('span',{text:team.abbr||team.fullName||'—'}),
      h('span',{text:p.pos||'—'}),
      h('span',{text:p.dob||'no DOB'}),
      h('span',{text:away+' @ '+home}),
      h('span',{text:slate.date}),
    ])]));

  var bd=h('div',{class:'card-bd'});

  /* §7.4 strips */
  if(C.card.ageStrip)bd.appendChild(ageStrip(p));
  if(C.card.bdayStrip)bd.appendChild(bdayStrip(p));
  if(C.card.statLine)bd.appendChild(statLine(p));

  /* flags (jersey/DOB, founders anniversaries) */
  r.flags.forEach(function(f){bd.appendChild(h('div',{class:'flagline',text:f.text}))});

  /* §7.2 the sacred format */
  if(C.card.groups){
    var individual=C.mode==='individual';
    var any=false;
    r.groups.forEach(function(g){
      /* SILENCE IS INFORMATION: zero-match counters do not render.
         §7.6 inverts this in Individual mode. */
      if(!g.hits.length&&!individual)return;
      any=true;
      bd.appendChild(renderGroup(g,individual));
    });
    if(!any&&!individual)bd.appendChild(h('div',{class:'nomatch',text:'no matches'}));
  }

  /* §7.4 opposing pitcher + team totals sections (Phase 2 content) */
  PHASE2_CARD.forEach(function(fn){fn(bd,r,A.ctx)});

  /* §7.5 probe */
  bd.appendChild(renderProbe(r));
  card.appendChild(bd);
  return card;
}

function renderGroup(g,individual){
  var c=g.counter;
  var wrap=h('div',{class:'mgroup '+(GROUP_CLASS[c.group]||'')+
    (c.splitScope?' g-stat-sp':'')+(g.hits.length?'':' muted-counter')});
  var spot=A.work.spotlight?+A.work.spotlight:null;
  var head=h('div',{class:'mhead',title:'tap for counter options',
    onclick:function(ev){counterMenu(ev,c)}},[
    h('span',{text:c.label+':'}),
    c.arith?h('span',{class:'arith',text:c.arith}):null,
    /* §7.3 "matching values light gold" — the counter's own value is a
       matching value when it is the spotlighted number. */
    h('span',{class:'mval'+(spot!=null&&c.value===spot?' spot-hit':''),text:fmt(c.value)}),
  ]);
  wrap.appendChild(head);
  if(c.detail&&individual)wrap.appendChild(h('div',{class:'nomatch',text:c.detail}));
  if(!g.hits.length){
    if(individual)wrap.appendChild(h('div',{class:'nomatch',text:'no matches'}));
    return wrap;
  }
  g.hits.forEach(function(x){wrap.appendChild(renderLine(x,c))});
  return wrap;
}

/* one receipt line — claim + receipt, ALWAYS together (§7.2). */
function renderLine(x,counter){
  var e=x.entry,spot=A.work.spotlight?+A.work.spotlight:null;
  var isSpot=spot!=null&&(e.v===spot||x.value===spot||counter.value===spot);
  var ciphers=e.ciphers&&e.ciphers.length?e.ciphers:(e.cipher?[e.cipher]:[]);
  var kids=[];
  if(x.depth>1&&x.chain)kids.push(h('span',{class:'chain',text:x.chain+' →'}));
  kids.push(h('span',{class:'w',text:e.cipher||e.kind==='phrase'||e.kind==='compose'?'"'+e.text+'"':e.text}));
  kids.push(h('span',{class:'eq',text:'='}));
  kids.push(h('span',{class:'v',text:fmt(e.v)}));
  if(ciphers.length){
    kids.push(h('span',{class:'cip',
      style:{color:CIPHER_COLOR[ciphers[0]]},
      text:'('+ciphers.map(cl).join('/')+')',
      title:'tap the cipher name to toggle it off everywhere',
      onclick:function(ev){ev.stopPropagation();toggleCipher(ciphers[0])}}));
  }
  /* non-gematria values carry no cipher chip; the FIX-1 provenance suffix
     (appended below) is their label -- no line is ever bare. */
  if(e.label&&e.kind==='date')kids.push(h('span',{class:'chain',text:'· '+e.label}));
  if(x.depth>1)kids.push(h('span',{class:'depth-chip',text:'d'+x.depth}));
  var pv=provSuffix(e);
  if(pv)kids.push(pv);
  return h('div',{class:'mline'+(isSpot?' spot-hit':''),
    title:'tap for context',
    onclick:function(ev){provPopover(ev,e,counter)}},kids);
}

/* §7.3 tap a cipher chip → toggle that cipher off globally, with undo. */
function toggleCipher(c){
  var was=A.cfg.ciphers[c];
  A.cfg.ciphers[c]=!was;
  onChange();
  toast(cl(c)+(was?' off':' on'),'Undo',function(){
    A.cfg.ciphers[c]=was;onChange();
  });
}
/* §7.3 tap a match line → hide word / match type / counter. */
/* Tap a match line -> options: hide this word / hide this match type /
   hide this counter (QUERY-SPEC 7.3). Rendered as a real popover so it works
   on a phone and can carry more choices than a browser prompt allows. */
function popMenu(ev,title,items,infoRows){
  closeMenu();
  var m=h('div',{class:'menu',id:'ctxMenu'},
    [h('div',{class:'mtitle',text:title})]
    .concat((infoRows||[]).map(function(r){return h('div',{class:'minfo',text:r})}))
    .concat(items.map(function(it){
      return h('button',{text:it[0],onclick:function(e){e.stopPropagation();closeMenu();it[1]()}});
    })));
  document.body.appendChild(m);
  var x=(ev&&ev.clientX)||20,y=(ev&&ev.clientY)||20;
  var r=m.getBoundingClientRect();
  var vw=window.innerWidth||360,vh=window.innerHeight||640;
  m.style.left=Math.max(8,Math.min(x,vw-r.width-8))+'px';
  m.style.top=Math.max(8,Math.min(y,vh-r.height-8))+'px';
  setTimeout(function(){document.addEventListener('click',closeMenu,{once:true})},0);
}
function closeMenu(){
  var m=document.getElementById('ctxMenu');
  if(m&&m.parentNode)m.parentNode.removeChild(m);
}
function spotlightValue(v){
  A.work.spotlight=String(v);saveWork();renderResults();
}
/* FIX-1 section 4: tap any receipt line -> context popover. One tap from
   "what is this" to answered. Tap-to-HIDE is gone (section 2) -- hiding
   lives in the filter sheet. */
function provPopover(ev,e,counter){
  var rows=[],acts=[];
  var ent=(e.src&&A.founders&&A.founders.byKey[e.src.entityKey])||
          (e.entityKey&&A.founders&&A.founders.byKey[e.entityKey])||null;
  if(ent){
    rows.push(catLabel(ent.cat)+' \u00b7 founded '+ent.founded+
      (ent.dayGranularity?'':' (year only)'));
    if(ent.founder)rows.push('founder: '+ent.founder+
      (ent.founderDob?' \u00b7 b. '+ent.founderDob:''));
    if(ent.birthplace)rows.push('birthplace: '+ent.birthplace);

        onclick:function(){

function expandTokens(q,p){
  var team=A.slate.teams[p.teamId]||{},opp=A.slate.teams[p.oppTeamId]||{};
  return String(q)
    .replace(/\{full name\}/gi,p.fullName||'')
    .replace(/\{first\}/gi,p.firstName||'')
    .replace(/\{last\}/gi,p.lastName||'')
    .replace(/\{team\}/gi,team.fullName||'')
    .replace(/\{opp\}/gi,opp.fullName||'')
    .replace(/\s+/g,' ').trim();
}

/* A probe tests its value against EVERY counter this player has — all
   batting/pitching stats in ALL THREE modes at once (Current, Next, and any
   Custom offsets currently configured), plus AB/PA ALWAYS (house rule: they
   advance every plate appearance — the confirmation layer), plus age/birthday
   spans, plus team totals when enabled. */
function runProbe(p,q){
  if(!A.ctx)return[];
  var txt=expandTokens(q,p);
  if(!txt)return[];
  var pool=[];
  if(/^\d+$/.test(txt))poolAdd(pool,+txt,'number '+txt,null,'probe');
  else addCiphered(pool,txt,'probe',A.cfg.ciphers);
  if(!pool.length)return[];
  var byValue={};
  pool.forEach(function(e){(byValue[e.v]=byValue[e.v]||[]).push(e)});

  var counters=probeCounters(p);
  var out=[];
  counters.forEach(function(c){
    var hits=matchCounter(c,byValue,A.ctx.depth);
    if(hits.length)out.push({counter:c,hits:hits});
  });
  return out;
}
/* the probe's counter set — deliberately WIDER than the main query's:
   every mode at once, and AB/PA regardless of the stat dialog. */
function probeCounters(p){
  var ctx=A.ctx,cfg=A.cfg,out=[],acc={probe:true};
  var push=function(group,gid,label,value,arith){
    if(!(value>0))return;
    out.push({group:group,gid:gid,label:label,value:value,arith:arith||null,accepts:acc});
  };
  var lanes=function(role,table,stats,conf){
    ['season','career'].forEach(function(scope){
      table.forEach(function(row){
        var label=row[0],key=row[1],c=conf[scope+'-'+key]||{};
        var rs=statScopeSrc(stats,scope,c.scope,p);
        var src=rs.src;if(!src)return;
        if(rs.tag)label=label+' ('+rs.tag+')';
        var base=src[key];
        if(base==null||!(base>0))return;
        var always=(key==='AB'||key==='PA');
        if(!c.on&&!always)return;
        push('stat','pb-'+scope+'-'+key+'-cur',cap(scope)+' '+role+' '+label,base);
        push('stat','pb-'+scope+'-'+key+'-nxt',cap(scope)+' '+role+' '+label+' (next)',base+1,
          fmt(base)+' + 1 = '+fmt(base+1));
        if(c.mode==='custom'&&+c.off){
          var o=Math.round(+c.off);
          push('stat','pb-'+scope+'-'+key+'-off',cap(scope)+' '+role+' '+label+' '+(o<0?'':'+')+o,
            base+o,fmt(base)+' '+(o<0?'-':'+')+' '+Math.abs(o)+' = '+fmt(base+o));
        }
      });
    });
  };
  if(p.isBatter)lanes('Batting',BAT_STATS,p.batting,cfg.stat.bat);
  if(p.isPitcher)lanes('Pitching',PIT_STATS,p.pitching,cfg.stat.pit);
  ageFigures(p,ctx).forEach(function(a){push('age','pb-age-'+a.key,a.label,a.value)});
  bdayFigures(p,ctx).forEach(function(a){push('bday','pb-bday-'+a.key,a.label,a.value)});
  ctx.dateVals.forEach(function(d){
    push('date','pb-date-'+d.id+'-'+(d.cipher||'')+'-'+d.n,d.label,d.n);
  });
  PHASE2_PROBE.forEach(function(fn){fn(out,p,ctx,acc)});
  return out;
}
var PHASE2_PROBE=[];

/* ============================================================
   17. SLATE LOAD + SCAN
============================================================ */
function loadSlate(dstr,force){
  var sport=A.sport,ad=ADAPTERS[sport];
  if(!ad){A.error='No adapter for '+sport;render();return Promise.resolve()}
  var key=slateKey(sport,dstr);
  if(!force){
    var cached=lsGet(key,null);
    if(cached&&cached.date===dstr){
      A.slate=cached;A.error=null;render();
      if(A.results.length||A.scanned)runScan();
      return Promise.resolve(cached);
    }
  }
  A.loading=true;A.progress='';A.error=null;render();
  return ad.fetchSlate(dstr,function(m){A.progress=m;
    var host=document.getElementById('results');
    if(host&&host.firstChild&&A.loading)renderResults();
  }).then(function(slate){
    A.slate=slate;A.loading=false;A.error=null;
    lsSet(key,slate);
    render();
    if(A.scanned)runScan();
    return slate;
  }).catch(function(e){
    A.loading=false;
    A.error='Slate fetch failed: '+e.message+' — the cached slate (if any) is still usable.';
    var cached=lsGet(key,null);
    if(cached)A.slate=cached;
    render();
  });
}

function runScan(){
  if(!A.slate||!A.boot.ok)return;
  var t0=(performance&&performance.now)?performance.now():Date.now();
  var res=scanSlate(A.slate,A.cfg,A.founders);
  var t1=(performance&&performance.now)?performance.now():Date.now();
  A.results=res.results;A.ctx=res.ctx;A.scanned=true;A.scanMs=Math.round(t1-t0);
  return A.scanMs;
}
function runButton(){
  if(A.cfg.mode==='individual'&&A.cfg.individualId==null){
    toast('Pick a player first');return;
  }
  runScan();render();
}

/* ============================================================
   18. BANNERS + TOP-LEVEL RENDER
============================================================ */
function renderBanners(){
  var host=document.getElementById('banners');
  clear(host);
  /* §9 — hard fail, visibly, before any number renders. */
  if(!A.boot.ok){
    host.appendChild(h('div',{class:'banner err',
      text:'ENGINE CHECKSUM FAILED — JESUIT ORDER returned '+JSON.stringify(A.boot.got)+
        ', expected '+JSON.stringify(A.boot.want)+'. No numbers will be rendered from a broken engine.'}));
    return;
  }
  if(A.error)host.appendChild(h('div',{class:'banner err',text:A.error}));
  /* §5.4 honest boundary on non-today dates. */
  if(currentDate()!==todayISO()){
    host.appendChild(h('div',{class:'banner warn',
      text:'⚠ stats shown are current, not as-of this date. Lineups and probables resolve historically; entering stats do not. True historical snapshots need a stat store (future phase).'}));
  }
  /* §4.1 slate cache banner. */
  if(A.slate&&A.slate.fetchedAt){
    var t=new Date(A.slate.fetchedAt);
    var hhmm=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
    var b=h('div',{class:'banner info'},[
      h('span',{text:'slate cached from '+hhmm+' · '+A.slate.games.length+' games · '}),
      h('button',{text:'tap to refresh',onclick:function(){loadSlate(A.slate.date,true)}}),
    ]);
    var noLineups=A.slate.games.filter(function(g){

    }).length;

      text:' · '+noLineups+' game'+(noLineups===1?'':'s')+' without posted lineups (active roster used)'}));

var PHASE2_BANNERS=[];

function render(){

/* ============================================================
   19. BOOT
============================================================ */
function boot(){
  A.sport=lsGet(LS.rail,{}).sport||'mlb';
  if(!SPORT_PROFILES[A.sport])A.sport='mlb';
  A.cfg=mergeCfg(defaultConfig(A.sport),lsGet(cfgKey(),null));
  A.cfg.sport=A.sport;
  A.work=mergeCfg({hiddenWords:[],hiddenFamilies:[],spotlight:'',
    probes:{},openProbes:{},collapsed:{}},lsGet(workKey(),null));
  /* migrate pre-FIX-1 tap-to-hide state: old type-level hides become family
     hides; counter-gid hides had no family equivalent and are retired. Never
     silently discard working state without a mapping (house rule). */
  if(Array.isArray(A.work.hiddenTypes)&&A.work.hiddenTypes.length){
    A.work.hiddenTypes.forEach(function(t){
      if(A.work.hiddenFamilies.indexOf(t)<0)A.work.hiddenFamilies.push(t);
    });
  }
  delete A.work.hiddenTypes;delete A.work.hiddenCounters;
  saveWork();

  document.getElementById('btnGear').onclick=function(){openDialog('card')};
  /* §5: on mobile the rail's resting state is the sticky summary bar. Desktop
     has no toggle, so it always starts open. Restored from storage when Tony
     has expressed a preference. */
  var railPref=lsGet(LS.rail,{});
  var narrow=typeof window.matchMedia==='function'
    &&window.matchMedia('(max-width:899px)').matches;
  A.railOpen=(railPref.railOpen===undefined||railPref.railOpen===null)?!narrow:!!railPref.railOpen;
  applyRail();
  document.getElementById('railSum').onclick=function(){
    A.railOpen=!A.railOpen;
    applyRail();
    persistRail();
  };
  /* beforeunload is unreliable on mobile (tab discard, app switch, PWA), so
     rail-level state is written on every change as well — house rule is
     auto-persist, and a lost sport selection is a lost session. */
  window.addEventListener('beforeunload',function(){saveCfg();saveWork();persistRail()});
  window.addEventListener('pagehide',function(){saveCfg();saveWork();persistRail()});
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(document.getElementById('ctxMenu'))closeMenu();
    else if(openDlg)closeDialog();
    else if(A.sheetOpen){A.sheetOpen=false;renderSheet()}
  });

  render();
  if(!A.boot.ok)return;               /* §9 — never fetch/render off a broken engine */
  loadFounders();
  loadSlate(currentDate());
}

/* founders layer is Phase 2 — the loader is defined there and no-ops here. */
function loadFounders(){return PHASE2_FOUNDERS_LOAD?PHASE2_FOUNDERS_LOAD():Promise.resolve()}
var PHASE2_FOUNDERS_LOAD=null;

/* ############################################################
   ##  PHASE 2 — THE EXCLUSIVE LAYERS                        ##
   ##  §6.9 Founders & Spans · §6.10 Career Clocks           ##
   ##  §6.11 Team Totals · §7.4 opp-pitcher + team sections  ##
   ############################################################ */

/* ---------------- founders data layer (§4.4) ----------------
   ONLY date_status==="locked" entries with a source URL participate in
   span math. The locked export already enforces that; this re-enforces it
   so a hand-edited or older file can never leak an unsourced date in.
   granularity==="year" entries are EXCLUDED from day-span calculations. */
var FOUNDERS_LOCAL='/data/founders-locked.json';
var FOUNDERS_RAW='https://raw.githubusercontent.com/taxwrities/realconvergy/main/data/decoder-exports/founders-locked.json';

function normalizeFounders(raw){
  var cats=[],byKey={},dropped={unlocked:0,nosource:0,nodate:0},yearOnly=0;
  Object.keys(raw||{}).forEach(function(cat){
    if(cat==='_meta')return;
    var list=raw[cat];
    if(!Array.isArray(list))return;
    var out=[];
    list.forEach(function(e,i){
      /* the two hard gates — never relaxed */
      if(e.date_status!=='locked'){dropped.unlocked++;return}
      if(!e.source){dropped.nosource++;return}
      if(!e.founded){dropped.nodate++;return}
      var dayGran=e.granularity==='day'&&isISO(e.founded);
      if(!dayGran)yearOnly++;
      var ent={
        key:cat+':'+(e.name||i),cat:cat,name:e.name||'(unnamed)',
        founded:e.founded,granularity:e.granularity||null,
        dayGranularity:dayGran,source:e.source,
        ciphers:e.ciphers||null,
        city:e.city||null,cityCiphers:e.city_ciphers||null,
        nickname:e.nickname||null,nicknameCiphers:e.nickname_ciphers||null,
        founder:e.founder||null,founderCiphers:e.founder_ciphers||null,
        founderDob:(e.founder_dob&&isISO(e.founder_dob))?e.founder_dob:null,
        founderDobDay:e.founder_dob_granularity==='day'&&isISO(e.founder_dob),
        birthplace:e.founder_birthplace||null,birthplaceCiphers:e.birthplace_ciphers||null,
        note:e.note||null,
      };
      out.push(ent);byKey[ent.key]=ent;
    });
    if(out.length)cats.push({id:cat,label:catLabel(cat),entities:out});
  });
  var all=cats.reduce(function(a,c){return a.concat(c.entities)},[]);
  return{cats:cats,byKey:byKey,all:all,
    dayCount:all.filter(function(e){return e.dayGranularity}).length,
    yearOnly:yearOnly,dropped:dropped,
    /* §6.9 feature-detect: these toggles only appear if the harvest landed. */
    hasFounderDob:all.some(function(e){return e.founderDob&&e.founderDobDay}),
    hasBirthplace:all.some(function(e){return e.birthplace&&e.birthplaceCiphers}),
    version:(raw&&raw._meta&&raw._meta.version)||null};
}
function catLabel(c){
  return({rituals:'Rituals',secret_societies:'Secret societies',institutional:'Institutional',
    sports_founders:'Sports founders',tribute_figures:'Tribute figures',
    mlb_teams:'MLB teams',wnba_teams:'WNBA teams',states:'States'})[c]||c;
}

PHASE2_FOUNDERS_LOAD=function(){
  var cached=lsGet(LS.founders,null);
  if(cached){applyFounders(cached,true)}
  return fetch(FOUNDERS_LOCAL).then(function(r){
    if(!r.ok)throw new Error('local '+r.status);
    return r.json();
  }).catch(function(){
    /* bundled copy unreachable → try the repo raw URL (§4.4) */
    return fetch(FOUNDERS_RAW).then(function(r){
      if(!r.ok)throw new Error('raw '+r.status);
      return r.json();
    });
  }).then(function(j){
    lsSet(LS.founders,j);
    applyFounders(j,false);
    if(A.scanned)runScan();
    render();
  }).catch(function(e){
    if(A.founders){
      A.foundersErr='Founders file unreachable ('+e.message+') — using the cached copy from an earlier session.';
    }else{
      A.foundersErr='Founders file unreachable ('+e.message+'). Founders & Spans and franchise clocks are unavailable; every other engine still works.';
      A.founders=null;
    }
    render();
  });
};
function applyFounders(raw,fromCache){
  A.founders=normalizeFounders(raw);
  if(!fromCache)A.foundersErr=null;
  /* §6.9 default: all entities ON — but only the categories this sport owns
     (§6.4: cross-sport table leakage is a bug, not a feature). */
  var prof=SPORT_PROFILES[A.sport];
  A.founders.cats.forEach(function(c){
    var allowed=prof.foundersCategories.indexOf(c.id)>=0;
    if(A.cfg.founders.cats[c.id]===undefined)A.cfg.founders.cats[c.id]=allowed;
    if(!allowed)A.cfg.founders.cats[c.id]=false;
    c.entities.forEach(function(e){
      if(A.cfg.founders.entities[e.key]===undefined)A.cfg.founders.entities[e.key]=true;
    });
  });
}
/* the entity set a scan actually consumes: sport-allowed category ON,
   entity ON, and — for day math — day granularity. */
function activeEntities(cfg,founders,dayOnly){
  if(!founders)return[];
  return founders.all.filter(function(e){
    if(!cfg.founders.cats[e.cat])return false;
    if(cfg.founders.entities[e.key]===false)return false;
    if(dayOnly&&!e.dayGranularity)return false;
    return true;
  });
}

/* ---------------- §6.9 entity spans vs the analysis date ---------------- */
function entitySpans(e,dstr,inclusive){
  if(!e.dayGranularity)return null;              /* year-only: excluded, never faked */
  return clockFrom(e.founded,dstr,inclusive);
}
/* computed once per scan, not per player */
function foundersCtx(ctx){
  if(ctx._fc)return ctx._fc;
  var cfg=ctx.cfg,inc=cfg.age.inclusive;
  var ents=cfg.types.founders?activeEntities(cfg,ctx.founders,false):[];
  var rows=[];
  ents.forEach(function(e){
    var ck=entitySpans(e,ctx.slate.date,inc);
    rows.push({e:e,ck:ck});
  });
  ctx._fc=rows;
  return rows;
}

/* founders spans join the POOL (§6.9) — testable against stats, names,
   phrases, date calcs, birthday spans. */
/* ============================================================
   FIX-1 SECTION 1 -- THE HOOK MODEL. An entity enters a game's match pool
   ONLY through at least one active hook. No hook -> no gematria values, no
   spans, no date convergences from that entity on that game's cards.
   Hooks are ROUTING (does this entity belong here?), not value judgments:
   QUERY-SPEC section 0 neutrality still governs everything after admission.
============================================================ */
var norm=function(x){return normText(x||'').toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim()};
function wordIn(hay,needle){
  if(!hay||!needle)return false;
  return(' '+norm(hay)+' ').indexOf(' '+norm(needle)+' ')>=0;
}
/* base pool (1.1): date calcs enabled in 6.6 + custom-phrase cipher values
   + the 6.8 specific-numbers list. Deliberately slate-level -- no per-player
   values, so date-hooked entities apply to every game equally. */
function baseHookPool(ctx){
  var set={};
  ctx.dateVals.forEach(function(d){set[d.n]=true});
  if(ctx.cfg.types.custom)ctx.cfg.custom.phrases.forEach(function(ph){
    if(!ph)return;
    var v=calcAll(ph);
    ALL_CIPHERS.forEach(function(c){if(ctx.cfg.ciphers[c]&&v[c]>0)set[v[c]]=true});
  });
  ctx.rawNums.forEach(function(v){set[v]=true});
  return set;
}
/* the active-entity lists cannot change mid-scan; filtering 127 entities
   twice per player was the visible cost at maximal settings. */
function activeOf(ctx,dayOnly){
  var k=dayOnly?'_actD':'_actA';
  if(!ctx[k])ctx[k]=activeEntities(ctx.cfg,ctx.founders,dayOnly);
  return ctx[k];
}
function hookCtxOf(ctx){
  if(ctx._hk)return ctx._hk;
  var cfg=ctx.cfg,F=ctx.founders;
  var hk={slate:{},game:{},player:{},base:{}};
  ctx._hk=hk;
  if(!cfg.types.founders||!F)return hk;
  hk.base=baseHookPool(ctx);
  var md=ctx.slate.date.slice(5);
  var phrases=(cfg.types.custom?cfg.custom.phrases:[]).filter(Boolean);
  var add=function(map,key,type,why){
    (map[key]=map[key]||[]).push({type:type,why:why});
  };
  activeOf(ctx,false).forEach(function(e){
    /* 1.3 manual hooks -- slate-wide */
    if(cfg.founders.manual[e.key])add(hk.slate,e.key,'manual','hooked by you');
    if(cfg.founders.widen[e.cat])add(hk.slate,e.key,'manual','category widened');
    if(phrases.some(function(ph){return wordIn(ph,e.name)}))
      add(hk.slate,e.key,'manual','theme: named in a custom phrase');
    /* 1.1 date hooks -- slate-level */
    if(e.dayGranularity){
      if(e.founded.slice(5)===md)add(hk.slate,e.key,'date','anniversary today');
      var ck=entitySpans(e,ctx.slate.date,cfg.age.inclusive);
      if(ck){
        if(hk.base[ck.totalDays])add(hk.slate,e.key,'date','days since founding = '+ck.totalDays);
        else if(hk.base[ck.since])add(hk.slate,e.key,'date','days since anniversary = '+ck.since);
        else if(hk.base[ck.until])add(hk.slate,e.key,'date','days until anniversary = '+ck.until);
      }
    }
    if(e.founderDob&&e.founderDobDay){
      if(e.founderDob.slice(5)===md)add(hk.slate,e.key,'date',e.founder+"'s birthday today");
      var fk=clockFrom(e.founderDob,ctx.slate.date,cfg.age.inclusive);
      if(fk&&(hk.base[fk.totalDays]||hk.base[fk.since]||hk.base[fk.until]))
        add(hk.slate,e.key,'date','founder-birthday span in the pool');
    }
  });
  /* 1.2 routing hooks -- per game */
  ctx.slate.games.forEach(function(g){
    var map=hk.game[g.gameId]={};
    var away=ctx.slate.teams[g.away.id]||{},home=ctx.slate.teams[g.home.id]||{};
    var states={};[away.state,home.state,g.venueState].forEach(function(st){if(st)states[st]=true});
    activeOf(ctx,false).forEach(function(e){
      if(e.cat==='mlb_teams'||e.cat==='wnba_teams'){
        if(e.name===away.fullName)add(map,e.key,'routing','away team');
        else if(e.name===home.fullName)add(map,e.key,'routing','home team');
      }else if(e.cat==='states'){
        if(states[e.name])add(map,e.key,'routing',
          e.name===g.venueState?'venue state':'team state');
      }
      /* city bridge: entity geography shares the game's geography */
      var geo=e.city||e.birthplace;
      if(geo){
        [away,home].forEach(function(t){
          if(wordIn(geo,t.city)||wordIn(geo,t.state))
            add(map,e.key,'routing','city bridge: '+geo+' ~ '+(t.abbr||t.fullName));
        });
      }
    });
  });
  return hk;
}
/* per-player hooks (birth state, cross-date convergence) -- lazy per player */
function playerHooks(ctx,p){
  var hk=hookCtxOf(ctx);
  if(hk.player[p.id])return hk.player[p.id];
  var map=hk.player[p.id]={};
  var cfg=ctx.cfg,F=ctx.founders;
  if(!cfg.types.founders||!F)return map;
  var add=function(key,type,why){(map[key]=map[key]||[]).push({type:type,why:why})};
  if(p.birthState){
    activeOf(ctx,false).forEach(function(e){
      if(e.cat==='states'&&e.name===p.birthState)
        add(e.key,'routing','birth state ('+(p.birthCity?p.birthCity+', ':'')+p.birthState+')');
    });
  }
  /* 1.1 last bullet: a direct date-to-date CONVERGENCE admits the entity for
     this card. Judgment call, documented in the handoff: "participates in a
     convergence" means month/day alignment with the player's dob/debut, OR a
     cross-date span value landing in the base pool -- a merely computable span
     between any two dates is not a convergence and hooks nothing. */
  if(cfg.founders.crossDates){
    var anchors=[p.dob];
    if(cfg.types.clocks&&cfg.founders.debutCross&&p.debut)anchors.push(p.debut);
    activeOf(ctx,true).forEach(function(e){
      var aligned=anchors.some(function(d){return d&&e.founded.slice(5)===d.slice(5)});
      if(!aligned&&cfg.founders.founderDob&&e.founderDob&&e.founderDobDay)
        aligned=anchors.some(function(d){return d&&e.founderDob.slice(5)===d.slice(5)});
      if(aligned){add(e.key,'date','date-to-date alignment');return}
      var xs=crossDateOf(p,ctx).filter(function(c){return c.entityKey===e.key});
      if(xs.some(function(c){return hk.base[c.value]}))
        add(e.key,'date','cross-date span in the pool');
    });
  }
  return map;
}
/* the union any producer consults: is this entity admitted for this player? */
function hookFor(ctx,p,entityKey){
  var hk=hookCtxOf(ctx);
  var m=hk.player[p.id]||playerHooks(ctx,p);
  if(m[entityKey])return m[entityKey][0];
  var g=hk.game[p.gameId];
  if(g&&g[entityKey])return g[entityKey][0];
  if(hk.slate[entityKey])return hk.slate[entityKey][0];
  return null;
}
/* everything hooked anywhere on the slate -- the filter sheet's Entities list */
function hookedForSlate(ctx){
  var hk=hookCtxOf(ctx),out={};
  var take=function(map){Object.keys(map).forEach(function(k){
    (out[k]=out[k]||[]).push.apply(out[k],map[k]);
  })};
  take(hk.slate);
  Object.keys(hk.game).forEach(function(gid){take(hk.game[gid])});
  Object.keys(hk.player).forEach(function(pid){take(hk.player[pid])});
  return out;
}

/* founders spans + entity gematria depend only on the ANALYSIS DATE and the
   entity set — never on the player — so they are produced once per scan. */
/* one place that turns an ADMITTED entity into pool entries, so the shared
   (slate-hooked) and per-player (game/player-hooked) producers cannot drift.
   Every entry carries FIX-1 section 4 provenance: the entity, the field that
   produced the word, and the hook that admitted it. */
function entityPoolEntries(out,e,hook,ctx){
  var cfg=ctx.cfg,S=cfg.founders.spans;
  var ck=entitySpans(e,ctx.slate.date,cfg.age.inclusive);
  var pushSpan=function(v,text){
    if(!(v>0))return;
    out.push({v:v,text:text,cipher:null,kind:'founders',label:'founded '+e.founded,
      entityKey:e.key,src:{entityKey:e.key,field:'span'},hook:hook});
  };
  if(ck){
    if(S.since)pushSpan(ck.totalDays,e.name+' \u2014 days since founding');
    if(S.sinceAnn)pushSpan(ck.since,e.name+' \u2014 days since anniversary');
    if(S.untilAnn)pushSpan(ck.until,e.name+' \u2014 days until anniversary');
  }
  if(cfg.founders.founderDob&&e.founderDob&&e.founderDobDay){
    var fk=clockFrom(e.founderDob,ctx.slate.date,cfg.age.inclusive);
    if(fk){
      if(S.since)pushSpan(fk.totalDays,e.founder+' \u2014 days since birth');
      if(S.sinceAnn)pushSpan(fk.since,e.founder+' \u2014 days since birthday');
      if(S.untilAnn)pushSpan(fk.until,e.founder+' \u2014 days until birthday');
    }
  }
  if(cfg.founders.gematria){
    var addC=function(ciphers,name,field){
      if(!ciphers||!name)return;
      ALL_CIPHERS.forEach(function(c){
        if(!cfg.ciphers[c]||!(ciphers[c]>0))return;
        out.push({v:ciphers[c],text:name,cipher:c,kind:'entity',label:null,
          entityKey:e.key,src:{entityKey:e.key,field:field},hook:hook});
      });
    };
    addC(e.ciphers,e.name,'name');
    addC(e.cityCiphers,e.city,'city');
    addC(e.nicknameCiphers,e.nickname,'nickname');
    addC(e.founderCiphers,e.founder,'founder');
    if(cfg.founders.birthplace)addC(e.birthplaceCiphers,e.birthplace,'birthplace');
  }
}
/* SLATE-hooked entities (date hooks, manual hooks) apply to every game
   equally (FIX-1 1.1 note), so their entries live in the shared pool. */
PHASE2_SHARED_POOL.push(function(out,ctx){
  var cfg=ctx.cfg;
  if(!cfg.types.founders||!ctx.founders)return;
  var hk=hookCtxOf(ctx);
  activeOf(ctx,false).forEach(function(e){
    var h=hk.slate[e.key];
    if(!h)return;
    entityPoolEntries(out,e,h[0],ctx);
  });
});
/* GAME-routing-hooked + PLAYER-hooked entities are admitted per card only. */
PHASE2_POOL.push(function(out,p,ctx){
  var cfg=ctx.cfg;
  if(!cfg.types.founders||!ctx.founders)return;

  var pm=playerHooks(ctx,p);
  activeOf(ctx,false).forEach(function(e){
    if(hk.slate[e.key])return;               /* already in the shared pool */
    var h=(pm[e.key]&&pm[e.key][0])||(g[e.key]&&g[e.key][0]);
    if(!h)return;
    entityPoolEntries(out,e,h,ctx);
  });
});
/* (entity ciphers come PRECOMPUTED in the JSON — regenerated through
   gematria-core, never hand-edited — and entityPoolEntries reads them
   rather than recomputing: one source of truth with the decoder export.) */

/* founders spans are also COUNTERS — the `⚑ Jesuit Order — N days since
   founding` grouping in §7.2. */
PHASE2_COUNTERS.push(function(out,p,ctx){
  var cfg=ctx.cfg;
  if(!cfg.types.founders||!ctx.founders)return;
  var S=cfg.founders.spans,acc=foundersAccepts(cfg);
  foundersCtx(ctx).forEach(function(r){
    if(!r.ck)return;
    /* FIX-1 section 1: no hook, no counter on this card */
    var hook=hookFor(ctx,p,r.e.key);
    if(!hook)return;
    var nm=r.e.name;
    var add=function(v,label,sfx){
      if(!(v>0))return;
      out.push({group:'founders',gid:'fnd-'+r.e.key+'-'+sfx,entityKey:r.e.key,
        label:'⚑ '+nm+' — '+label,value:v,detail:'founded '+r.e.founded,

    if(S.sinceAnn)add(r.ck.since,'days since anniversary','ann');
    if(S.untilAnn)add(r.ck.until,'days until anniversary','until');
  });
  /* §6.9 direct date-to-date convergence — player dates x entity dates,
     independent of today. */
  if(cfg.founders.crossDates)crossDateOf(p,ctx).forEach(function(c){
    /* the convergence itself may be the hook; any other hook also admits */
    if(!hookFor(ctx,p,c.entityKey))return;
    out.push(c);
  });
});
/* Both the counter side and the pool side need the same cross-date set, and
   at maximal settings it is the single most expensive thing on the page — so
   it is computed ONCE per player and shared. Cleared with the scan context. */
function crossDateOf(p,ctx){
  var cache=ctx._xd||(ctx._xd={});
  var hit=cache[p.id];
  if(hit)return hit;
  var out=[];
  crossDateCounters(out,p,ctx,FOUNDERS_ACCEPTS);
  return(cache[p.id]=out);
}
/* ...and the SAME cross-date values join the player's POOL, because the spec
   says the value is "testable against all enabled targets (stats, names,
   phrases, date calcs, thread numbers)" -- and a stat is a COUNTER, which can
   only be reached from the pool side. Player-specific, so this is a per-player
   producer rather than a shared one. */
PHASE2_POOL.push(function(out,p,ctx){
  var cfg=ctx.cfg;
  if(!cfg.types.founders||!ctx.founders||!cfg.founders.crossDates)return;
  crossDateOf(p,ctx).forEach(function(c){
    if(!(c.value>0))return;
    var hook=hookFor(ctx,p,c.entityKey);
    if(!hook)return;
    out.push({v:c.value,text:c.label.replace(/^⚑ /,''),cipher:null,
      kind:'founders',label:c.detail,entityKey:c.entityKey,
      src:{entityKey:c.entityKey,field:'span'},hook:hook});
  });
});
/* one shared, frozen kind map — allocating a fresh one per player per entity
   was measurable at maximal settings. */
var FOUNDERS_ACCEPTS={pName:true,pFirst:true,pLast:true,tName:true,tLoc:true,tMascot:true,
  oName:true,oLoc:true,oMascot:true,compose:true,phrase:true,date:true,raw:true,
  bdaySpan:true,age:true,jersey:true,entity:true};
function foundersAccepts(cfg){return FOUNDERS_ACCEPTS}

/* §6.9 "Player dates x entity dates" */
function crossDateCounters(out,p,ctx,acc){
  var cfg=ctx.cfg,inc=cfg.age.inclusive;
  var anchors=[{d:p.dob,tag:'birth'}];
  if(cfg.types.clocks&&cfg.founders.debutCross&&p.debut)anchors.push({d:p.debut,tag:'debut'});
  anchors.forEach(function(a){
    if(!a.d)return;
    foundersCtx(ctx).forEach(function(r){
      var e=r.e;
      if(!e.dayGranularity)return;
      var pairs=[[e.founded,e.name,'']];
      /* founder DOB spans — only when the harvest landed AND the toggle is on */
      if(cfg.founders.founderDob&&e.founderDob&&e.founderDobDay)
        pairs.push([e.founderDob,e.founder+' (b.)','fdob']);
      pairs.forEach(function(pr){
        var from=pr[0],nm=pr[1],sfx=pr[2];
        /* days from entity date to the player's date (either direction) */
        var span=daysBetween(from,a.d);
        if(span==null)return;
        var abs=Math.abs(span)+(inc?1:0);
        var dir=span>=0?'after':'before';
        if(abs>0)out.push({group:'founders',gid:'fx-'+e.key+sfx+'-'+a.tag+'-days',entityKey:e.key,
          label:'⚑ '+nm+' → '+a.tag+' date — '+abs.toLocaleString()+' days '+dir,
          value:abs,detail:from+' → '+a.d,accepts:acc});
        if(abs>=7)out.push({group:'founders',gid:'fx-'+e.key+sfx+'-'+a.tag+'-weeks',entityKey:e.key,
          label:'⚑ '+nm+' → '+a.tag+' date — weeks',value:Math.floor(abs/7),
          detail:Math.floor(abs/7)+'w '+(abs%7)+'d',accepts:acc});
        var mo=monthsBetween(from,a.d);
        if(mo>0)out.push({group:'founders',gid:'fx-'+e.key+sfx+'-'+a.tag+'-months',entityKey:e.key,
          label:'⚑ '+nm+' → '+a.tag+' date — months',value:mo,detail:from+' → '+a.d,accepts:acc});
        /* offset alignment: how far the player's date sits from the entity's
           anniversary. No hardcoded offsets — the pool decides what is hot,
           which is how "born 322 days after X" surfaces. */
        var off=annOffset(from,a.d,inc);
        if(off.after>0)out.push({group:'founders',gid:'fx-'+e.key+sfx+'-'+a.tag+'-offA',entityKey:e.key,
          label:'⚑ '+a.tag+' date is '+off.after+' days AFTER the '+nm+' anniversary',
          value:off.after,detail:'anniversary '+from.slice(5),accepts:acc});
        if(off.before>0)out.push({group:'founders',gid:'fx-'+e.key+sfx+'-'+a.tag+'-offB',entityKey:e.key,
          label:'⚑ '+a.tag+' date is '+off.before+' days BEFORE the '+nm+' anniversary',
          value:off.before,detail:'anniversary '+from.slice(5),accepts:acc});
      });
    });
  });
}
/* whole calendar months between two dates (day-of-month aware) */
function monthsBetween(a,b){
  var A2=new Date(utc(a)),B2=new Date(utc(b));
  if(isNaN(A2)||isNaN(B2))return 0;
  var m=(B2.getUTCFullYear()-A2.getUTCFullYear())*12+(B2.getUTCMonth()-A2.getUTCMonth());
  if(B2.getUTCDate()<A2.getUTCDate())m--;
  return Math.abs(m);
}
/* distance from `target`'s month/day to `origin`'s month/day, both directions */
function annOffset(origin,target,inclusive){
  var O=new Date(utc(origin)),T=new Date(utc(target));
  if(isNaN(O)||isNaN(T))return{after:0,before:0};
  var y=T.getUTCFullYear();
  var ann=Date.UTC(y,O.getUTCMonth(),O.getUTCDate());
  var tt=utc(target),add=inclusive?1:0;
  var after,before;
  if(tt>=ann){
    after=Math.round((tt-ann)/864e5);
    before=Math.round((Date.UTC(y+1,O.getUTCMonth(),O.getUTCDate())-tt)/864e5);
  }else{
    after=Math.round((tt-Date.UTC(y-1,O.getUTCMonth(),O.getUTCDate()))/864e5);
    before=Math.round((ann-tt)/864e5);
  }
  return{after:after?after+add:0,before:before?before+add:0};
}

/* §6.9 anniversary alignment → an explicit FLAG line, not a silent value. */
/* "anniversary flag (=0 days)" from the spans-vs-analysis-date list: TODAY is
   this entity's anniversary. A zero-day span is correctly rejected by the v>0
   pool and counter guards (zero matches nothing), so a flag line is the only
   honest surface for it -- which is exactly what the spec asks for. This is a
   DIFFERENT requirement from the player-date alignment flag below. */
PHASE2_FLAGS.push(function(out,p,ctx){
  var cfg=ctx.cfg;
  if(!cfg.types.founders||!ctx.founders)return;

  if(!S.since&&!S.sinceAnn&&!S.untilAnn)return;
  var md=ctx.slate.date.slice(5);
  activeEntities(cfg,ctx.founders,true).forEach(function(e){
    if(e.founded.slice(5)!==md)return;

      text:'⚑ TODAY is the '+e.name+' anniversary — founded '+e.founded+
        (ck?' · year '+ck.years:'')});

});

/* ---------------- §6.10 Career Clocks ---------------- */
PHASE2_COUNTERS.push(function(out,p,ctx){
  var cfg=ctx.cfg;
  if(!cfg.types.clocks)return;
  var K=cfg.clocks,inc=cfg.age.inclusive,acc=foundersAccepts(cfg);

     mlb_teams. ONLY day-granularity entries qualify (§4.4); a year-only

    var ent=team&&franchiseEntity(ctx.founders,team,ctx.cfg);

          label:team.fullName+' — weeks since franchise founding',value:fk.weeks,
          detail:fk.weeks+'w '+fk.weekRem+'d',accepts:acc});

  /* TODO (§6.10, explicitly OPTIONAL): H2H meeting counts. data/mlb-h2h.json
     is a 209KB build-time import in the four-tab app and is NOT served to
     this page; wiring it would mean shipping another static file. The spec
     says skip if it requires new heavy fetches — skipped, noted here. */
});
function franchiseEntity(founders,team,cfg){
  var cats=founders.cats.filter(function(c){return c.id==='mlb_teams'||c.id==='wnba_teams'});
  for(var i=0;i<cats.length;i++){
    if(!cfg.founders.cats[cats[i].id])continue;
    var hit=cats[i].entities.filter(function(e){return e.name===team.fullName})[0];
    if(hit)return hit;
  }
  return null;
}

/* ---------------- §6.11 Team Totals ---------------- */
function teamCounters(team,cfg,acc){
  var out=[];
  if(!team||!team.seasonTotals)return out;
  TEAM_STATS.forEach(function(row){
    var label=row[0],key=row[1],c=cfg.teamTotals[key];
    if(!c||!c.on)return;
    var base=team.seasonTotals[key];
    if(base==null||!(base>0))return;
    var off=c.mode==='current'?0:(c.mode==='next'?1:Math.round(+c.off||0));
    var val=base+off;
    if(!(val>0))return;
    out.push({group:'team',gid:'team-'+team.id+'-'+key,
      label:(team.abbr||team.fullName)+' season '+label+(off===0?'':(off===1?' (next)':' '+(off<0?'':'+')+off)),
      value:val,
      arith:off===0?null:base.toLocaleString()+' '+(off<0?'-':'+')+' '+Math.abs(off)+' = '+val.toLocaleString(),
      detail:null,accepts:acc});
  });
  return out;
}
PHASE2_COUNTERS.push(function(out,p,ctx){
  var cfg=ctx.cfg;
  if(!cfg.simple.teamTotals)return;
  var team=ctx.slate.teams[p.teamId];
  teamCounters(team,cfg,statAccepts(cfg)).forEach(function(c){out.push(c)});
});

PHASE2_CARD.push(function(bd,r,ctx){

     gematria + his relevant stat counters, same claim+receipt format. */
  if(cfg.card.oppPitcher&&p.isBatter){

    var oppSide=p.side==='away'?'home':'away';

    var sp=spId!=null&&A.slate.players[spId];
    var sect=h('div',{class:'sect'});

      var pool=[];
      addCiphered(pool,sp.fullName,'phrase',cfg.ciphers);
      addCiphered(pool,sp.firstName,'phrase',cfg.ciphers);
      addCiphered(pool,sp.lastName,'phrase',cfg.ciphers);
      var byValue={};
      pool.forEach(function(e){(byValue[e.v]=byValue[e.v]||[]).push(e)});
      /* his relevant stat counters, matched against the BATTER's pool */
      var batPool={};
      (r.raw?r.raw.pool:[]).forEach(function(e){(batPool[e.v]=batPool[e.v]||[]).push(e)});
      var acc=statAccepts(cfg);acc.phrase=true;
      var spCounters=[];
      pushStatCounters(spCounters,cfg.stat.pit,PIT_STATS,sp.pitching,'Pitching',acc,sp);
      var any=false;

        if(hits.length){any=true;sect.appendChild(renderGroup({counter:c,hits:hits},false))}
      });
      /* the pitcher's own name values landing on the batter's counters */
      r.groups.forEach(function(g){

      }})]));
    if(open){
      if(!team||!team.seasonTotals){
        s2.appendChild(h('div',{class:'nomatch',text:'team season totals unavailable'}));
      }else{
        s2.appendChild(h('div',{class:'strip'},TEAM_STATS.map(function(row){
          var v=team.seasonTotals[row[1]];
          return h('span',{},[h('span',{class:'k',text:row[0]+' '}),h('b',{text:fmt(v)+'  '})]);
        })));
        var tc=teamCounters(team,cfg,statAccepts(cfg));
        var byV={};
        (r.raw?r.raw.pool:[]).forEach(function(e){(byV[e.v]=byV[e.v]||[]).push(e)});
        var hit=false;
        tc.forEach(function(c){
          var hits=matchCounter(c,byV,ctx.depth);
          if(hits.length){hit=true;s2.appendChild(renderGroup({counter:c,hits:hits},false))}
        });
        if(!hit)s2.appendChild(h('div',{class:'nomatch',text:'no team-total matches'}));

      h('p',{class:'hint',text:'An anniversary (0 days) raises a flag line on the card. All spans respect the End-date-included toggle in Player Total Age.'}),
    ]));
    bd.appendChild(sec('Direct date-to-date convergence',[
      crow('Player dates × entity dates',G.crossDates,function(e){G.crossDates=e.target.checked;onChange();renderDialog()}),
      h('p',{class:'hint',text:'Spans computed BETWEEN a player’s dates and an entity’s dates, independent of today: total days / weeks / months, anniversary alignment (flag line), and offset alignment — no hardcoded offsets, the pool decides what is hot.'}),
      G.crossDates?crow('Also use the player’s MLB debut date (needs Career Clocks)',G.debutCross,
        function(e){G.debutCross=e.target.checked;onChange()}):null,
    ]));
    var extras=[crow('Founders gematria as values',G.gematria,function(e){
      G.gematria=e.target.checked;onChange();
    })];
    /* §6.9 feature-detect: hide, do not error, when the harvest is absent. */
    if(F.hasFounderDob)extras.push(crow('Founder-birthday spans',G.founderDob,function(e){
      G.founderDob=e.target.checked;onChange();
    }));
    if(F.hasBirthplace)extras.push(crow('Founder birthplace city gematria',G.birthplace,function(e){
      G.birthplace=e.target.checked;onChange();
    }));
    if(!F.hasFounderDob&&!F.hasBirthplace)extras.push(h('p',{class:'hint',
      text:'The historian’s founder_dob / birthplace harvest is not in this founders file, so those toggles are hidden (feature-detected, not an error).'}));
    bd.appendChild(sec('Extra value sources',extras));
  }
};

/* ---------------- §6.10 dialog ---------------- */
DIALOGS.clocks={
  title:'Career Clocks',
  body:function(bd){
    var K=A.cfg.clocks,L=A.cfg.age.lanes;
    bd.appendChild(sec('Player',[
      crow('Days since MLB debut',K.debutSince,function(e){K.debutSince=e.target.checked;onChange()}),
      crow('Days since debut anniversary',K.debutAnnSince,function(e){K.debutAnnSince=e.target.checked;onChange()}),
      crow('Days until debut anniversary',K.debutAnnUntil,function(e){K.debutAnnUntil=e.target.checked;onChange()}),
      h('p',{class:'hint',text:'Debut date rides the slate hydrate (statsapi mlbDebutDate) — no extra fetch.'}),
    ]));
    /* §6.10: birthday spans are ONE implementation surfaced in BOTH dialogs.
       These are the very same lane objects Player Total Age edits. */
    bd.appendChild(sec('Birthday spans (shared with Player Total Age)',[
      crow('Days since last birthday',L.bdaySince.on,function(e){L.bdaySince.on=e.target.checked;onChange();renderDialog()}),
      crow('Days until next birthday',L.bdayUntil.on,function(e){L.bdayUntil.on=e.target.checked;onChange();renderDialog()}),
      h('p',{class:'hint',text:'One implementation, two surfaces — flipping these flips the same switches in the Player Total Age dialog.'}),
    ]));
    var F=A.founders;
    var frNote='Franchise founding dates come from the founders layer’s team table.';
    if(F){
      var mt=(F.cats.filter(function(c){return c.id==='mlb_teams'})[0]||{entities:[]}).entities;
      var day=mt.filter(function(e){return e.dayGranularity}).length;
      frNote+=' '+day+' of '+mt.length+' MLB franchises carry a day-granularity founding date; the rest are year-only and produce NO day span (never back-filled).';
    }
    bd.appendChild(sec('Franchise',[
      crow('Days / weeks since franchise founding',K.franchise,function(e){K.franchise=e.target.checked;onChange();renderDialog()}),
      h('p',{class:'hint',text:frNote}),
      h('p',{class:'hint',text:'TODO (§6.10, optional): H2H meeting counts are skipped — data/mlb-h2h.json is a build-time import in the four-tab app and is not served to this page.'}),
    ]));
  }
};

/* ---------------- §6.11 Team Totals config ---------------- */
DIALOGS.teamTotals={
  title:'Team Totals',
  footer:function(){return[h('button',{class:'btn',text:'Bulk Apply…',onclick:bulkApply})]},
  body:function(bd){
    bd.appendChild(h('p',{class:'hint',text:'Team season counting stats as matchable counters, with the same Current / Next / Custom modes as player stats. Hits attach to the TEAM and render in the team-totals card section and the per-game team summary row.'}));
    var wrap=h('div',{class:'dsec'},[h('h3',{text:'Season totals'})]);
    var grid=h('div',{class:'statwrap'});
    TEAM_STATS.forEach(function(row){
      var label=row[0],key=row[1],c=A.cfg.teamTotals[key];
      var card=h('div',{class:'statcard'+(c.on?' on':'')});
      card.appendChild(h('div',{class:'sc-hd'},[
        h('input',{type:'checkbox',checked:c.on?true:null,onchange:function(e){
          c.on=e.target.checked;onChange();renderDialog();
        }}),h('span',{text:label})]));
      if(c.on){
        card.appendChild(h('div',{class:'modes'},[
          h('button',{class:c.mode==='current'?'on':'',text:'Current',onclick:function(){c.mode='current';onChange();renderDialog()}}),
          h('button',{class:c.mode==='next'?'on':'',text:'Next',onclick:function(){c.mode='next';onChange();renderDialog()}}),
          h('button',{class:c.mode==='custom'?'on':'',text:'Custom',onclick:function(){c.mode='custom';onChange();renderDialog()}}),
        ]));
        if(c.mode==='custom')card.appendChild(h('input',{class:'off',type:'number',value:c.off,
          onchange:function(e){c.off=Math.round(+e.target.value||0);onChange();renderDialog()}}));
      }
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
    bd.appendChild(wrap);
  }
};
/* Team Totals is listed under §6.1 "simple sources" but §6.11 gives it
   per-stat modes, so it gets a Configure button too — §0: more control. */
SIMPLE_SOURCES.filter(function(s){return s.id==='teamTotals'})
  .forEach(function(s){s.cfg='teamTotals'});

/* the master dialog renders Configure on any simple source that declares one */
(function patchTypesDialog(){
  var orig=DIALOGS.types.body;
  DIALOGS.types.body=function(bd){
    orig(bd);
    var secs=bd.querySelectorAll('.dsec');
    var simpleSec=secs[secs.length-2];
    if(!simpleSec)return;
    var rows=simpleSec.querySelectorAll('.crow');
    SIMPLE_SOURCES.forEach(function(s,i){
      if(!s.cfg||!rows[i])return;
      rows[i].appendChild(h('button',{class:'cfg',text:'Configure',
        onclick:function(){openDialog(s.cfg)}}));
    });
  };
})();

/* founders status line under the banners */
PHASE2_BANNERS.push(function(host){
  if(!A.founders||!A.cfg.types.founders)return;
  var F=A.founders,n=activeEntities(A.cfg,F,true).length;
  host.appendChild(h('div',{class:'banner info',
    text:'founders layer v'+F.version+' · '+n+' day-granularity entities active of '+
      F.all.length+' locked+sourced · year-only entries excluded from day spans'}));
});

/* expose the pure engine for the headless tests (node/jsdom). */
var API={calcAll:calcAll,checksum:checksum,ALL_CIPHERS:ALL_CIPHERS,cl:cl,normText:normText,
  isPrime:isPrime,primeIndex:primeIndex,compositeIndex:compositeIndex,
  nthPrime:nthPrime,nthComposite:nthComposite,chainSteps:chainSteps,
  utc:utc,ymd:ymd,daysBetween:daysBetween,shiftDate:shiftDate,dayOfYear:dayOfYear,
  clockFrom:clockFrom,dateCalcs:dateCalcs,DATE_FORMULAS:DATE_FORMULAS,
  defaultConfig:defaultConfig,mergeCfg:mergeCfg,
  buildPool:buildPool,buildCounters:buildCounters,scanPlayer:scanPlayer,
  scanSlate:scanSlate,makeCtx:makeCtx,matchCounter:matchCounter,parseNums:parseNums,
  ageFigures:ageFigures,bdayFigures:bdayFigures,dedupePool:dedupePool,
  SPORT_PROFILES:SPORT_PROFILES,ADAPTERS:ADAPTERS,state:A,
  render:render,runScan:runScan,boot:boot,
  /* Phase 2 surface */
  normalizeFounders:normalizeFounders,activeEntities:activeEntities,
  entitySpans:entitySpans,annOffset:annOffset,monthsBetween:monthsBetween,
  teamCounters:teamCounters,franchiseEntity:franchiseEntity,
  applyFounders:applyFounders,loadFounders:loadFounders,
  TEAM_STATS:TEAM_STATS,BAT_STATS:BAT_STATS,PIT_STATS:PIT_STATS,
  /* FIX-1 surface */
  hookCtxOf:hookCtxOf,hookFor:hookFor,playerHooks:playerHooks,
  hookedForSlate:hookedForSlate,baseHookPool:baseHookPool,
  statScopeSrc:statScopeSrc,filterCount:filterCount,renderSheet:renderSheet,
  provParts:provParts,muteWord:muteWord,ABBR2STATE:ABBR2STATE};
if(typeof window!=='undefined'){
  window.__QUERY__=API;
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
  else boot();
}

})();
</script>
