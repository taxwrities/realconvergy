<!doctype html>
<html lang="en" data-astryx-theme="gothic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0f15">
<title>Daily Matches — Slate Query Engine</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- The CSS below asks for Fustat / JetBrains Mono / Manufacturing Consent,
     which are NOT system fonts. apps/mlb/index.html loads them from Google
     Fonts; this page is served standalone out of public/ and inherits nothing
     from it, so it must load them itself. Without this block the whole page
     silently falls back (Segoe UI + Consolas on Windows) and looks nothing
     like the app it sits inside. Same families/weights/href as index.html. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Fustat:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Manufacturing+Consent&display=swap">
<style>
/* ============================================================
   query.html — Slate Query Engine ("Daily Matches")
   QUERY-SPEC.md. Single file, no build step, mobile-first.
   Palette lifted from apps/mlb/src/cvg.css so the page reads as
   part of the same app without importing it (public/ has no build).
============================================================ */
:root{
  --bg:#0c0f15; --sf-1:#151a23; --sf-2:#1a202b; --sf-3:#171c26;
  --line:rgba(148,158,180,.14); --line-hi:rgba(148,158,180,.26);
  --ink:#e8eaf0; --ink-2:#8a90a0; --ink-3:#5f6678;
  --gold:#ffb02e; --green:#35d07f; --blue:#46a6ff; --cyan:#46d0ff;
  --purple:#d046ff; --red:#e24b4a; --orange:#ff8a3d; --pink:#ff6ba8;
  --lime:#b8e04a; --teal:#2fd0c0;
  --acc:var(--purple); --acc-ink:#1d0526;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --sans:'Fustat',system-ui,-apple-system,'Segoe UI',sans-serif;
  --card-grad:linear-gradient(180deg,#1a202b 0%,#151a23 100%);
  --card-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 6px 20px rgba(0,0,0,.35);
  /* counter-type colors (§7.2 "color by counter type", consistent across cards) */
  --c-age:#46d0ff; --c-bday:#35d07f; --c-stat:#ffb02e; --c-date:#d046ff;
  --c-founders:#ff8a3d; --c-clock:#b8e04a; --c-team:#ff6ba8; --c-probe:#2fd0c0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:radial-gradient(1100px 420px at 50% -180px,rgba(208,70,255,.09),transparent 65%),
             linear-gradient(180deg,#0d1017 0%,#0c0f15 340px);
  background-color:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.45;
  overscroll-behavior-y:none; -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--acc)}

/* ---------------- app frame ---------------- */
.app{display:flex;flex-direction:column;min-height:100%}
.hdr{
  position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:8px;
  padding:10px 12px;background:rgba(12,15,21,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
/* same treatment cvg.css gives .shell-title, so the header reads as the same
   product as the four-tab app rather than a bolted-on page */
.hdr-title{font-family:'Manufacturing Consent',var(--sans);font-size:21px;
  font-weight:400;letter-spacing:.5px;line-height:1.05}
.hdr-title em{color:var(--acc);font-style:normal}
.hdr-sub{font-family:var(--mono);font-size:10px;color:var(--ink-2);margin-top:1px;
  display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hdr-spacer{flex:1}
.icon-btn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  background:var(--sf-1);display:grid;place-items:center;font-size:15px;color:var(--ink-2);
}
.icon-btn:active{background:var(--sf-2)}
.lg-pill{
  font-size:9px;font-weight:800;letter-spacing:1px;color:var(--acc);
  border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);
  border-radius:5px;padding:1px 5px;
}
.back-link{font-size:11px;font-family:var(--mono);color:var(--ink-2);
  border:1px solid var(--line);border-radius:8px;padding:5px 9px;text-decoration:none;white-space:nowrap}

/* banners */
.banner{margin:8px 12px;padding:9px 11px;border-radius:10px;font-size:12px;
  font-family:var(--mono);line-height:1.4}
.banner.err{background:rgba(226,75,74,.14);border:1px solid rgba(226,75,74,.5);color:#ffb3b2}
.banner.warn{background:rgba(255,176,46,.11);border:1px solid rgba(255,176,46,.42);color:#ffd48a}
.banner.info{background:var(--sf-1);border:1px solid var(--line);color:var(--ink-2)}
.banner button{color:var(--acc);text-decoration:underline;padding:0;font-size:inherit}

/* ---------------- layout: rail + results ---------------- */
.body{display:flex;flex-direction:column;gap:0;flex:1}
@media(min-width:900px){
  .body{flex-direction:row;align-items:flex-start;max-width:1500px;margin:0 auto;width:100%}
  .rail{position:sticky;top:58px;width:310px;flex:0 0 310px;max-height:calc(100vh - 58px);
    overflow-y:auto;border-right:1px solid var(--line);border-bottom:none}
  .results{flex:1;min-width:0}
}

/* ---------------- rail ---------------- */
.rail{padding:10px 12px 18px;border-bottom:1px solid var(--line)}
/* the collapse toggle only EXISTS below 900px (.rail-sum is display:none
   above it), so the collapsed state must not survive into desktop layout —
   otherwise a phone-collapsed rail becomes an invisible rail with no control. */
@media(max-width:899px){.rail.collapsed .rail-body{display:none}}
.rail-sum{
  display:none;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;
  background:var(--sf-1);border:1px solid var(--line);font-family:var(--mono);font-size:11px;
  color:var(--ink-2);width:100%;text-align:left;
}
@media(max-width:899px){
  .rail{position:sticky;top:52px;z-index:50;background:rgba(12,15,21,.94);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-bottom:10px}
  .rail-sum{display:flex}
  .rail-body{margin-top:10px;max-height:64vh;overflow-y:auto;
    padding-right:2px;-webkit-overflow-scrolling:touch}
}
.rail-sum b{color:var(--ink);font-weight:700}
.rail-sum .chev{margin-left:auto;color:var(--ink-3)}

.fld{margin-bottom:11px}
.fld > label,.fld-label{
  display:block;font-size:10px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:5px;
}
.ctl{
  width:100%;background:var(--sf-1);border:1px solid var(--line);border-radius:10px;
  padding:9px 10px;font-size:13px;color:var(--ink);
}
.ctl:focus{outline:none;border-color:var(--line-hi)}
select.ctl{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),
  linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
.summary-btn{
  width:100%;display:flex;align-items:center;gap:8px;background:var(--sf-1);
  border:1px solid var(--line);border-radius:10px;padding:9px 10px;text-align:left;
  font-size:12.5px;color:var(--ink);
}
.summary-btn .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--acc)}
.summary-btn:active{background:var(--sf-2)}
.seg{display:flex;background:var(--sf-1);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--acc);color:var(--acc-ink);font-weight:700}
.daterow{display:flex;gap:5px;align-items:center}
.daterow .ctl{flex:1;min-width:0}
.daterow button{
  width:32px;height:36px;flex:0 0 32px;border:1px solid var(--line);border-radius:9px;
  background:var(--sf-1);color:var(--ink-2);font-size:14px;display:grid;place-items:center}
.today-btn{
  width:auto!important;flex:0 0 auto!important;padding:0 10px!important;
  font-size:11px!important;font-family:var(--mono)}
.run-btn{
  width:100%;margin-top:6px;padding:13px;border-radius:12px;background:var(--acc);
  color:var(--acc-ink);font-weight:800;font-size:14.5px;letter-spacing:.4px;
  box-shadow:0 6px 18px rgba(208,70,255,.28);
}
.run-btn:disabled{opacity:.5;box-shadow:none}
.run-btn:active{transform:translateY(1px)}
.mini-btn{
  font-size:11px;font-family:var(--mono);padding:5px 8px;border-radius:8px;
  border:1px solid var(--line);background:var(--sf-1);color:var(--ink-2)}
.mini-btn.on{border-color:var(--acc);color:var(--acc)}
.row-btns{display:flex;gap:5px;flex-wrap:wrap}

/* preset row */
.preset-row{display:flex;gap:5px}
.preset-row select{flex:1;min-width:0}

/* game filter list */
.gamelist{max-height:170px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;
  background:var(--sf-1);padding:4px}
.gamelist label{display:flex;gap:7px;align-items:center;padding:5px 6px;border-radius:7px;
  font-size:12px;font-family:var(--mono);color:var(--ink-2)}
.gamelist label:active{background:var(--sf-2)}

/* typeahead */
.ta-wrap{position:relative}
.ta-list{position:absolute;top:100%;left:0;right:0;z-index:70;margin-top:3px;
  background:var(--sf-3);border:1px solid var(--line-hi);border-radius:10px;
  max-height:210px;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.ta-list button{display:block;width:100%;text-align:left;padding:8px 10px;font-size:12.5px;
  border-bottom:1px solid var(--line)}
.ta-list button:last-child{border-bottom:none}
.ta-list button:active{background:var(--sf-2)}
.ta-list .sub{font-family:var(--mono);font-size:10px;color:var(--ink-3)}

/* ---------------- results ---------------- */
.results{padding:10px 12px 90px}
.res-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.res-count{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.res-count b{color:var(--ink)}
.spot-wrap{position:relative;flex:1;min-width:130px}
.spot{width:100%;background:var(--sf-1);border:1px solid var(--line);border-radius:9px;
  padding:7px 9px;font-family:var(--mono);font-size:12px}
.spot.on{border-color:var(--gold);color:var(--gold)}
.grid{display:grid;gap:11px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1180px){.grid{grid-template-columns:repeat(3,1fr)}}
.grid.individual{grid-template-columns:1fr!important;max-width:760px}

/* card */
.card{
  background:var(--card-grad);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--card-shadow);overflow:hidden;
}
.card-hd{padding:9px 11px;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.015)}
.card-name{font-size:14.5px;font-weight:700;line-height:1.2;display:flex;
  align-items:baseline;gap:6px;flex-wrap:wrap}
.card-name .badge{
  margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:800;
  background:var(--acc);color:var(--acc-ink);border-radius:6px;padding:1px 6px;flex:0 0 auto}
.p-mark{font-family:var(--mono);font-size:9px;font-weight:800;color:var(--cyan);
  border:1px solid color-mix(in srgb,var(--cyan) 45%,transparent);border-radius:4px;padding:0 4px}
.card-meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:3px;
  display:flex;gap:5px;flex-wrap:wrap}
.card-meta span:not(:last-child)::after{content:' ·';color:var(--ink-3)}
.card-bd{padding:9px 11px}

/* strips (card display config) */
.strip{font-family:var(--mono);font-size:11px;color:var(--ink-2);
  background:var(--sf-2);border:1px solid var(--line);border-radius:9px;
  padding:6px 8px;margin-bottom:8px;line-height:1.55}
.strip b{color:var(--ink);font-weight:600}
.strip .k{color:var(--ink-3)}

/* the sacred format (§7.2) */
.mgroup{margin-bottom:9px}
.mgroup:last-child{margin-bottom:0}
.mhead{
  font-family:var(--mono);font-size:12px;font-weight:700;line-height:1.3;
  display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;cursor:pointer;
}
.mhead .mval{margin-left:auto;font-size:13px;font-weight:800}
.mhead .arith{color:var(--ink-3);font-weight:400;font-size:10.5px}
.mline{
  font-family:var(--mono);font-size:11.5px;color:var(--ink-2);
  padding:1.5px 0 1.5px 10px;line-height:1.45;cursor:pointer;
  border-left:2px solid var(--line);margin-left:1px;
  display:flex;gap:5px;align-items:baseline;flex-wrap:wrap;
}
.mline:active{background:rgba(255,255,255,.03)}
.mline .w{color:var(--ink)}
.mline .eq{color:var(--ink-3)}
.mline .v{font-weight:700}
.mline .cip{font-size:10.5px}
.mline .kindtag{color:var(--ink-3);font-style:italic}
/* FIX-1 section 4 provenance suffix; truncates gracefully on mobile, the
   tap popover always carries the full chain */
.mline .prov{color:var(--ink-3);font-size:10px;font-style:italic;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:58vw}
@media(min-width:900px){.mline .prov{max-width:none;white-space:normal}}
.mline.spot-hit{background:rgba(255,176,46,.14);border-left-color:var(--gold);border-radius:0 6px 6px 0}
.mval.spot-hit{color:var(--gold)!important;background:rgba(255,176,46,.16);
  border-radius:5px;padding:0 4px}
/* tap-a-line options (7.3) -- a real menu, not a browser prompt */
.menu{position:fixed;z-index:150;background:var(--sf-3);border:1px solid var(--line-hi);
  border-radius:11px;box-shadow:0 12px 34px rgba(0,0,0,.6);padding:4px;min-width:196px;
  max-width:min(90vw,300px)}
.menu button{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:8px;
  font-size:12.5px;color:var(--ink)}
.menu button:active{background:var(--sf-2)}
.menu .mtitle{font-family:var(--mono);font-size:10px;color:var(--ink-3);padding:5px 10px 3px;
  word-break:break-word}
.menu .minfo{font-family:var(--mono);font-size:11px;color:var(--ink-2);padding:3px 10px;
  word-break:break-word;border-left:2px solid var(--line);margin:2px 6px}
.mline.spot-hit .v{color:var(--gold)}
.mline .chain{color:var(--ink-3);font-size:10.5px}
.depth-chip{font-family:var(--mono);font-size:9px;font-weight:800;border-radius:4px;
  padding:0 3px;border:1px solid currentColor;opacity:.85}
.flagline{font-family:var(--mono);font-size:11.5px;padding:2px 0 2px 10px;
  border-left:2px solid var(--c-founders);color:var(--c-founders);font-weight:600}
.muted-counter{opacity:.42}
.muted-counter .mval{font-weight:600}
.nomatch{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
  padding:1px 0 1px 10px;border-left:2px solid var(--line)}

/* counter-type colors */
.g-age .mhead{color:var(--c-age)} .g-age .mline{border-left-color:color-mix(in srgb,var(--c-age) 35%,transparent)}
.g-bday .mhead{color:var(--c-bday)} .g-bday .mline{border-left-color:color-mix(in srgb,var(--c-bday) 35%,transparent)}
.g-stat .mhead{color:var(--c-stat)} .g-stat .mline{border-left-color:color-mix(in srgb,var(--c-stat) 35%,transparent)}
/* FIX-1 3.2: split-scoped stat counters -- a distinct shade of the stat color */
.g-stat-sp .mhead{color:#ffd27a} .g-stat-sp .mline{border-left-color:color-mix(in srgb,#ffd27a 40%,transparent)}
.g-date .mhead{color:var(--c-date)} .g-date .mline{border-left-color:color-mix(in srgb,var(--c-date) 35%,transparent)}
.g-founders .mhead{color:var(--c-founders)} .g-founders .mline{border-left-color:color-mix(in srgb,var(--c-founders) 35%,transparent)}
.g-clock .mhead{color:var(--c-clock)} .g-clock .mline{border-left-color:color-mix(in srgb,var(--c-clock) 35%,transparent)}
.g-team .mhead{color:var(--c-team)} .g-team .mline{border-left-color:color-mix(in srgb,var(--c-team) 35%,transparent)}

/* card sections (opp pitcher / team totals) */
.sect{margin-top:9px;border-top:1px dashed var(--line-hi);padding-top:8px}
.sect-hd{font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:1px;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.sect-hd button{margin-left:auto;font-size:10px;color:var(--ink-3)}

/* probe (§7.5) */
.probe{margin-top:9px;border:1px dashed var(--c-probe);border-radius:10px;padding:8px;
  background:rgba(47,208,192,.05)}
.probe-hd{font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:1.2px;
  color:var(--c-probe);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.probe-hd button{margin-left:auto;color:var(--ink-3);font-size:11px}
.probe-chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px}
.probe-chips button{font-family:var(--mono);font-size:10px;padding:3px 6px;border-radius:6px;
  border:1px solid var(--line);color:var(--ink-2);background:var(--sf-1)}
.probe-in{display:flex;gap:5px}
.probe-in input{flex:1;min-width:0;background:var(--sf-1);border:1px solid var(--line);
  border-radius:8px;padding:7px 9px;font-family:var(--mono);font-size:12px}
.probe-in button{padding:0 11px;border-radius:8px;background:var(--c-probe);color:#04201d;
  font-weight:800;font-size:12px}
.probe-item{margin-top:7px;border-top:1px solid rgba(47,208,192,.18);padding-top:6px}
.probe-item .pq{font-family:var(--mono);font-size:11.5px;color:var(--c-probe);font-weight:700;
  display:flex;gap:6px;align-items:center}
.probe-item .pq button{margin-left:auto;font-size:10px;color:var(--ink-3)}
.promote{border:1px solid var(--c-probe)!important;color:var(--c-probe)!important;
  border-radius:6px;padding:1px 5px!important;font-family:var(--mono)}
.probe-open{font-family:var(--mono);font-size:11px;color:var(--c-probe);
  border:1px dashed color-mix(in srgb,var(--c-probe) 45%,transparent);border-radius:8px;
  padding:5px 8px;width:100%;margin-top:8px}

/* ---------------- dialogs ---------------- */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(6,8,12,.72);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.scrim{align-items:center;padding:20px}}
.dlg{
  background:var(--sf-3);border:1px solid var(--line-hi);width:100%;max-width:660px;
  max-height:92vh;display:flex;flex-direction:column;
  border-radius:16px 16px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.55);
}
@media(min-width:700px){.dlg{border-radius:16px;max-height:86vh}}
.dlg-hd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--sf-3);z-index:2;border-radius:16px 16px 0 0}
.dlg-hd h2{margin:0;font-size:15px;font-weight:700}
.dlg-hd .x{margin-left:auto;font-size:20px;color:var(--ink-3);width:30px;height:30px;
  display:grid;place-items:center;border-radius:8px}
.dlg-bd{padding:12px 14px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.dlg-ft{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:7px;
  background:var(--sf-3);position:sticky;bottom:0}
.dlg-ft .grow{flex:1}
.btn{padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--sf-1);
  font-size:12.5px;color:var(--ink)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent;font-weight:700}

.dsec{margin-bottom:15px}
.dsec > h3{margin:0 0 7px;font-size:10.5px;font-weight:800;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--ink-3)}
.hint{font-size:11px;color:var(--ink-3);line-height:1.45;margin:0 0 7px;font-family:var(--mono)}

/* checkbox rows */
.crow{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;
  border:1px solid var(--line);background:var(--sf-1);margin-bottom:5px}
.crow:active{background:var(--sf-2)}
.crow label{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer}
.crow .cfg{font-size:11px;font-family:var(--mono);color:var(--acc);border:1px solid
  color-mix(in srgb,var(--acc) 40%,transparent);border-radius:7px;padding:3px 8px;flex:0 0 auto}
.crow .cfg[disabled]{opacity:.35;border-color:var(--line);color:var(--ink-3)}
.crow .inline-val{font-family:var(--mono);font-size:11px;color:var(--gold);flex:0 0 auto}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--acc);flex:0 0 auto;margin:0}
.sublist{padding-left:8px;border-left:2px solid var(--line);margin:5px 0 9px}

/* cipher grid */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.ccard{border:1.5px solid var(--line);border-radius:10px;padding:7px 8px;text-align:left;
  background:var(--sf-1);font-family:var(--mono);font-size:11.5px;color:var(--ink-3);line-height:1.3}
.ccard .cn{font-weight:800;font-size:12px;display:block}
.ccard .cv{font-size:10px;opacity:.75}
.ccard.on{background:var(--sf-2)}

/* phrase rows */
.prow{display:flex;gap:5px;margin-bottom:5px;align-items:center}
.prow input{flex:1;min-width:0;background:var(--sf-1);border:1px solid var(--line);
  border-radius:9px;padding:8px 9px;font-family:var(--mono);font-size:12px}
.prow .del{width:32px;flex:0 0 32px;height:34px;border:1px solid var(--line);border-radius:9px;
  color:var(--ink-3);display:grid;place-items:center;background:var(--sf-1)}
.pvals{font-family:var(--mono);font-size:10px;color:var(--ink-3);padding:0 0 6px 2px;
  word-break:break-word}

/* stat cards */
.statwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.statcard{border:1px solid var(--line);border-radius:10px;background:var(--sf-1);padding:7px}
.statcard.on{border-color:color-mix(in srgb,var(--c-stat) 45%,transparent)}
.statcard .sc-hd{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.statcard .modes{display:flex;gap:3px;margin-top:6px}
.statcard .modes button{flex:1;font-family:var(--mono);font-size:9.5px;padding:4px 2px;
  border-radius:6px;border:1px solid var(--line);color:var(--ink-3)}
.statcard .modes button.on{background:var(--c-stat);color:#241700;font-weight:800;border-color:transparent}
.statcard input.off{width:100%;margin-top:5px;background:var(--sf-2);border:1px solid var(--line);
  border-radius:7px;padding:4px 6px;font-family:var(--mono);font-size:11px}

/* entity picker (§6.9) */
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.pill{font-family:var(--mono);font-size:11px;padding:5px 9px;border-radius:20px;
  border:1px solid var(--line);color:var(--ink-2);background:var(--sf-1)}
.pill.on{border-color:var(--c-founders);color:var(--c-founders)}
.entlist{max-height:250px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;
  background:var(--sf-1);padding:4px}
.entrow{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:7px;font-size:12px}
.entrow .g-year{font-family:var(--mono);font-size:9px;color:var(--ink-3);
  border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:auto;flex:0 0 auto}
.entrow.excluded{opacity:.5}

/* toast + tray */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:200;
  background:var(--sf-3);border:1px solid var(--line-hi);border-radius:11px;
  padding:9px 13px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);
  display:flex;gap:11px;align-items:center;max-width:calc(100vw - 24px)}
.toast button{color:var(--acc);font-weight:700;font-size:12.5px}
/* ---------------- FIX-1 section 2: filter sheet ----------------
   bottom sheet on mobile (~85% height, grid visible behind), right panel
   on desktop. Dark, sectioned, chip toggles; counts per section; no Apply
   -- every toggle recomputes live. */
.sheet-scrim{position:fixed;inset:0;z-index:90;background:rgba(6,8,12,.35)}
.sheet{position:fixed;z-index:95;background:var(--sf-3);border:1px solid var(--line-hi);
  display:flex;flex-direction:column;box-shadow:0 -12px 40px rgba(0,0,0,.55)}
@media(max-width:899px){
  .sheet{left:0;right:0;bottom:0;height:85vh;border-radius:16px 16px 0 0}
}
@media(min-width:900px){
  .sheet{top:0;right:0;bottom:0;width:400px;border-radius:0;
    box-shadow:-12px 0 40px rgba(0,0,0,.5)}
}
.sheet-hd{display:flex;align-items:center;gap:8px;padding:12px 14px;
  border-bottom:1px solid var(--line)}
.sheet-hd h2{margin:0;font-size:15px;font-weight:700}
.sheet-hd .cnt{font-family:var(--mono);font-size:11px;color:var(--acc)}
.sheet-bd{flex:1;overflow-y:auto;padding:10px 14px 20px;-webkit-overflow-scrolling:touch}
.sheet-ft{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.ssec{margin-bottom:14px}
.ssec-hd{display:flex;align-items:baseline;gap:7px;margin-bottom:6px}
.ssec-hd h3{margin:0;font-size:10.5px;font-weight:800;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--ink-3)}
.ssec-hd .scount{font-family:var(--mono);font-size:10px;color:var(--acc)}
.ssec-hd .sreset{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;padding:5px 9px;border-radius:16px;
  border:1px solid var(--line);color:var(--ink-3);background:var(--sf-1)}
.chip.on{color:var(--ink);border-color:var(--line-hi);background:var(--sf-2)}
.filters-btn{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;
  padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:var(--sf-1);
  color:var(--ink-2);flex:0 0 auto}
.filters-btn .fbadge{background:var(--acc);color:var(--acc-ink);border-radius:9px;
  padding:0 6px;font-weight:800;font-size:10.5px}
.hook-tag{font-family:var(--mono);font-size:9px;border:1px solid var(--line);
  border-radius:4px;padding:0 4px;color:var(--ink-3);margin-left:auto;flex:0 0 auto}
.tray-btn{display:none!important}

.empty{padding:34px 16px;text-align:center;color:var(--ink-3);font-family:var(--mono);font-size:12.5px;
  line-height:1.6}
.empty b{display:block;color:var(--ink-2);font-size:13.5px;margin-bottom:5px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line-hi);
  border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div>
      <div class="hdr-title">DAILY <em>MATCHES</em></div>
      <div class="hdr-sub" id="hdrSub"><span class="lg-pill" id="hdrSport">MLB</span></div>
    </div>
    <div class="hdr-spacer"></div>
    <a class="back-link" href="/">← Board</a>
    <button class="icon-btn" id="btnGear" aria-label="Card display config">⚙</button>
  </header>

  <div id="banners"></div>

  <div class="body">
    <aside class="rail" id="rail">
      <button class="rail-sum" id="railSum" aria-expanded="true">
        <span id="railSumTxt">query</span><span class="chev">▾</span>
      </button>
      <div class="rail-body" id="railBody"></div>
    </aside>
    <main class="results" id="results"></main>
  </div>
</div>

<div id="dialogHost"></div>
<div id="sheetHost"></div>
<div id="toastHost"></div>
<button class="tray-btn" id="trayBtn" style="display:none"></button>

<script>
/* eslint-disable */
(function(){
'use strict';
/* ============================================================
   1. GEMATRIA — embedded verbatim from packages/gematria-core/gematria.js
   (QUERY-SPEC §3: public/ has no build step, so the engine is COPIED, not
   refactored. Values are regression-locked — DO NOT ALTER.)
   The ONE addition is normText(): QUERY-SPEC §9 requires NFD normalization +
   diacritical stripping before ciphering. gematria-core's letters() drops
   non-a-z entirely, so "José" would lose the accented letter instead of
   folding it to "e". normText() runs BEFORE letters(), so every unaccented
   string — including the JESUIT ORDER checksum — is bit-identical to the app.
============================================================ */
var CHALDEAN={a:1,b:2,c:3,d:4,e:5,f:8,g:3,h:5,i:1,j:1,k:2,l:3,m:4,n:5,o:7,p:8,q:1,r:2,s:3,t:4,u:6,v:6,w:6,x:5,y:1,z:7};
var SEPTENARY={a:1,b:2,c:3,d:4,e:5,f:6,g:7,h:6,i:5,j:4,k:3,l:2,m:1,n:1,o:2,p:3,q:4,r:5,s:6,t:7,u:6,v:5,w:4,x:3,y:2,z:1};
var LATIN={a:1,b:2,c:3,d:4,e:5,f:6,g:7,h:8,i:9,k:10,l:20,m:30,n:40,o:50,p:60,q:70,r:80,s:90,t:100,u:200,v:700,x:300,y:400,z:500,j:600,w:900};
var red1=function(v){while(v>9)v=String(v).split('').reduce(function(a,d){return a+ +d},0);return v};
/* §9 house rule: NFD-normalize, strip combining marks, then cipher. */
function normText(s){
  /* combining-mark range written as escapes so re-encoding the file cannot
     corrupt the class (U+0300..U+036F). */
  return String(s==null?'':s).normalize('NFD').replace(new RegExp('[\\u0300-\\u036f]','g'),'');
}
var letters=function(s){return normText(s).toLowerCase().split('').filter(function(c){return c>='a'&&c<='z'})};

function calcAll(s){
  var L=letters(s);
  var ord=L.reduce(function(a,c){return a+(c.charCodeAt(0)-96)},0);
  return{Ord:ord,
    Red:L.reduce(function(a,c){return a+red1(c.charCodeAt(0)-96)},0),
    Rev:L.reduce(function(a,c){return a+(27-(c.charCodeAt(0)-96))},0),
    RR:L.reduce(function(a,c){return a+red1(27-(c.charCodeAt(0)-96))},0),
    Sat:ord+35*L.length,
    RevSat:L.reduce(function(a,c){return a+(62-(c.charCodeAt(0)-96))},0),
    Chal:L.reduce(function(a,c){return a+CHALDEAN[c]},0),
    Sept:L.reduce(function(a,c){return a+SEPTENARY[c]},0),
    Latin:L.reduce(function(a,c){return a+LATIN[c]},0)};
}
var CIPHER_LABEL={Ord:'Ordinal',Red:'Reduction',Rev:'Rev Ordinal',RR:'Rev Reduction',
  Sat:'Satanic',RevSat:'Rev Satanic',Chal:'Chaldean',Sept:'Septenary',Latin:'Jewish'};
var cl=function(c){return CIPHER_LABEL[c]||c};
var ALL_CIPHERS=['Ord','Red','Rev','RR','Sat','RevSat','Chal','Sept','Latin'];
/* §6.2 signature colors — the SAME ink used for that cipher on result cards. */
var CIPHER_COLOR={Ord:'#ffb02e',Red:'#35d07f',Rev:'#46a6ff',RR:'#d046ff',Sat:'#e24b4a',
  RevSat:'#ff8a3d',Chal:'#2fd0c0',Sept:'#b8e04a',Latin:'#ff6ba8'};
/* EXTENSION POINT (§6.2): the reference site runs 27 ciphers (Fibonacci,
   Sumerian, Trigonal…). Those are NOT in gematria-core, so they are NOT
   implemented here — inventing variants would produce numbers Tony's other
   tools disagree with. To add one later: add the letter table above, add the
   key to calcAll's return, CIPHER_LABEL, ALL_CIPHERS and CIPHER_COLOR — the
   whole UI is data-driven off ALL_CIPHERS and needs no other change. */

/* §9 checksum — hard gate before first render. */
function checksum(){
  var v=calcAll('JESUIT ORDER');
  var ok=v.Ord===144&&v.Red===54&&v.Rev===153&&v.RR===72&&v.Sat===529;
  return{ok:ok,got:v,want:{Ord:144,Red:54,Rev:153,RR:72,Sat:529}};
}

/* ============================================================
   2. NUMBERS — prime/composite sieve (§8 index chaining, §6.6 nth prime).
   Mirrors packages/gematria-core/numbers.js (locks: nthPrime(12)=37,
   nthComposite(8)=15, primeIndex(61)=18) but SIEVE_N is raised from 100k
   to 200k: founders day-spans reach ~177,444 (Society of Jesus 1540-09-27),
   and a 100k sieve would silently refuse to index them.
============================================================ */
var SIEVE_N=200000;
var _comp=new Uint8Array(SIEVE_N+1);
for(var _i=2;_i*_i<=SIEVE_N;_i++)if(!_comp[_i])for(var _j=_i*_i;_j<=SIEVE_N;_j+=_i)_comp[_j]=1;
var _pc=new Int32Array(SIEVE_N+1),_cc=new Int32Array(SIEVE_N+1);
var _plist=[0],_clist=[0];
for(var _k=2;_k<=SIEVE_N;_k++){
  var _pr=!_comp[_k];
  _pc[_k]=_pc[_k-1]+(_pr?1:0);_cc[_k]=_cc[_k-1]+((_k>=4&&_comp[_k])?1:0);
  if(_pr)_plist.push(_k);else if(_k>=4)_clist.push(_k);
}
function isPrime(n){return n>=2&&n<=SIEVE_N&&!_comp[n]}
function primeIndex(n){return isPrime(n)?_pc[n]:-1}
function compositeIndex(n){return(n>=4&&n<=SIEVE_N&&_comp[n])?_cc[n]:-1}
function nthPrime(n){return _plist[n]||0}
function nthComposite(n){return _clist[n]||0}

/* ============================================================
   3. DATE MATH — §9: UTC date-only arithmetic, no timezone drift.
   Every date in this file is a "YYYY-MM-DD" string; every span is an
   integer number of whole UTC days.
============================================================ */
function isISO(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)}
function utc(dstr){ // -> ms at UTC midnight, or NaN
  if(!isISO(dstr))return NaN;
  var p=dstr.split('-');
  return Date.UTC(+p[0],+p[1]-1,+p[2]);
}
function ymd(ms){
  var d=new Date(ms);
  return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
}
function daysBetween(a,b){ // whole UTC days from a to b (exclusive of end)
  var A=utc(a),B=utc(b);
  if(isNaN(A)||isNaN(B))return null;
  return Math.round((B-A)/864e5);
}
function todayISO(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function shiftDate(dstr,n){var t=utc(dstr);return isNaN(t)?dstr:ymd(t+n*864e5)}
function isLeap(y){return y%4===0&&(y%100!==0||y%400===0)}
function dayOfYear(dstr){
  var p=dstr.split('-');
  return Math.round((utc(dstr)-Date.UTC(+p[0],0,1))/864e5)+1;
}
var DAY_NAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var RULERS={Sunday:'Sun',Monday:'Moon',Tuesday:'Mars',Wednesday:'Mercury',
  Thursday:'Jupiter',Friday:'Venus',Saturday:'Saturn'};
function dayName(dstr){var t=utc(dstr);return isNaN(t)?null:DAY_NAMES[new Date(t).getUTCDay()]}

/* clockFrom(origin, on, inclusive) — calendar-exact, leap-aware anniversary
   clock. `inclusive` is the §6.7 "End date included" global toggle: it adds
   one day to every SPAN count (total / since / until), never to the calendar
   year or month figures. Returns null when origin is missing/after `on`. */
function clockFrom(origin,on,inclusive){
  var O=utc(origin),D=utc(on);
  if(isNaN(O)||isNaN(D)||D<O)return null;
  var od=new Date(O),dd=new Date(D);
  var oM=od.getUTCMonth(),oD=od.getUTCDate();
  var years=dd.getUTCFullYear()-od.getUTCFullYear();
  var annThis=Date.UTC(dd.getUTCFullYear(),oM,oD);
  if(annThis>D){years--;annThis=Date.UTC(dd.getUTCFullYear()-1,oM,oD)}
  var annNext=Date.UTC(new Date(annThis).getUTCFullYear()+1,oM,oD);
  var add=inclusive?1:0;
  var totalDays=Math.round((D-O)/864e5)+add;
  var since=Math.round((D-annThis)/864e5)+add;
  var until=Math.round((annNext-D)/864e5)+add;
  var months=(dd.getUTCFullYear()-od.getUTCFullYear())*12+(dd.getUTCMonth()-oM);
  if(dd.getUTCDate()<oD)months--;
  return{years:years,since:since,until:until,totalDays:totalDays,
    weeks:Math.floor(totalDays/7),weekRem:totalDays%7,
    months:months,monthRem:daysSinceMonthMark(origin,on)+add,
    yearDays:since,anniversary:since===add};
  function daysSinceMonthMark(o,d2){
    var O2=new Date(utc(o)),D2=new Date(utc(d2));
    var m=Date.UTC(D2.getUTCFullYear(),D2.getUTCMonth(),O2.getUTCDate());
    if(m>utc(d2))m=Date.UTC(D2.getUTCFullYear(),D2.getUTCMonth()-1,O2.getUTCDate());
    return Math.round((utc(d2)-m)/864e5);
  }
}

/* ============================================================
   4. DATE CALCULATIONS (§6.6) — Tony's spine, implemented exactly as
   listed. No inventions. Each formula is an individually toggleable
   entry carrying its own label, arithmetic string and computed value,
   so the dialog can show the value inline and the card can print the
   receipt. Recomputed whenever the analysis date changes.
============================================================ */
var DATE_FORMULAS=[
  {id:'doy',   label:'Day of Year'},
  {id:'left',  label:'Days Left in Year'},
  {id:'mddccyy',label:'M+DD+CC+YY (full)'},
  {id:'mddYdig',label:'M+DD+Y-digit-sum'},
  {id:'alldig',label:'All-digit sum'},
  {id:'mddY2000',label:'M+DD+(YYYY-2000)'},
  {id:'mdddigYYdig',label:'Mdig+Ddig+YYdig'},
  {id:'mdddigYYCC',label:'Mdig+Ddig+YY+CC'},
  {id:'mdddigY2000',label:'Mdig+Ddig+(YYYY-2000)'},
  {id:'mdd',   label:'M+DD'},
  {id:'dd',    label:'DD (day of month)'},
  {id:'ddPrime',label:'Day-of-month Nth prime'},
  {id:'ddComposite',label:'Day-of-month Nth composite'},
  {id:'catMD', label:'Date concat M/DD'},
  {id:'catDM', label:'Date concat DD/M'},
  {id:'dayName',label:'Day name gematria'},
  {id:'ruler', label:'Ruling planet gematria'},
];
var DATE_FORMULA_IDS=DATE_FORMULAS.map(function(f){return f.id});

/* dateCalcs(dstr, enabledIds, enabledCiphers) -> [{id,label,calc,n,cipher}]
   Numeric formulas yield one entry; the two gematria formulas (day name,
   ruling planet) yield one entry PER enabled cipher (§6.6 last bullet). */
function dateCalcs(dstr,on,ciphers){
  if(!isISO(dstr))return[];
  var p=dstr.split('-'),YYYY=+p[0],M=+p[1],DD=+p[2];
  var YY=YYYY%100,CC=Math.floor(YYYY/100);
  var dsum=function(n){return String(n).split('').reduce(function(a,x){return a+ +x},0)};
  var dstr2=function(n){return String(n).split('').join('+')};
  var doy=dayOfYear(dstr),left=(isLeap(YYYY)?366:365)-doy;
  var out=[],want=function(id){return!on||on[id]};
  var push=function(id,label,calc,n,cipher,word){
    if(!(n>0))return;
    out.push({id:id,label:label,calc:calc,n:n,cipher:cipher||null,word:word||null});
  };
  if(want('doy'))push('doy','Day of Year','day '+doy+' of '+YYYY,doy);
  if(want('left'))push('left','Days Left in Year',(isLeap(YYYY)?366:365)+' - '+doy,left);
  if(want('mddccyy'))push('mddccyy','M+DD+CC+YY','('+M+') + ('+DD+') + ('+CC+') + ('+YY+')',M+DD+CC+YY);
  if(want('mddYdig'))push('mddYdig','M+DD+Y-digit-sum','('+M+') + ('+DD+') + '+dstr2(YYYY),M+DD+dsum(YYYY));
  if(want('alldig'))push('alldig','All-digit sum',dstr2(M)+' + '+dstr2(DD)+' + '+dstr2(YYYY),dsum(M)+dsum(DD)+dsum(YYYY));
  if(want('mddY2000'))push('mddY2000','M+DD+(YYYY-2000)','('+M+') + ('+DD+') + ('+(YYYY-2000)+')',M+DD+(YYYY-2000));
  if(want('mdddigYYdig'))push('mdddigYYdig','Mdig+Ddig+YYdig',dstr2(M)+' + '+dstr2(DD)+' + '+dstr2(YY),dsum(M)+dsum(DD)+dsum(YY));
  if(want('mdddigYYCC'))push('mdddigYYCC','Mdig+Ddig+YY+CC',dstr2(M)+' + '+dstr2(DD)+' + ('+YY+') + ('+CC+')',dsum(M)+dsum(DD)+YY+CC);
  if(want('mdddigY2000'))push('mdddigY2000','Mdig+Ddig+(YYYY-2000)',dstr2(M)+' + '+dstr2(DD)+' + ('+(YYYY-2000)+')',dsum(M)+dsum(DD)+(YYYY-2000));
  if(want('mdd'))push('mdd','M+DD','('+M+') + ('+DD+')',M+DD);
  if(want('dd'))push('dd','DD (day of month)','day '+DD,DD);
  if(want('ddPrime'))push('ddPrime','Day-of-month Nth prime','prime #'+DD,nthPrime(DD));
  if(want('ddComposite'))push('ddComposite','Day-of-month Nth composite','composite #'+DD,nthComposite(DD));
  if(want('catMD'))push('catMD','Date concat','concat '+M+'/'+DD,+(''+M+DD));
  if(want('catDM'))push('catDM','Date concat','concat '+DD+'/'+M,+(''+DD+M));
  var dn=dayName(dstr);
  if(dn){
    var rl=RULERS[dn];
    if(want('dayName')){
      var dv=calcAll(dn);
      ALL_CIPHERS.forEach(function(c){if(!ciphers||ciphers[c])push('dayName','day name','"'+dn+'"',dv[c],c,dn)});
    }
    if(want('ruler')){
      var rv=calcAll(rl);
      ALL_CIPHERS.forEach(function(c){if(!ciphers||ciphers[c])push('ruler','ruling planet','"'+rl+'"',rv[c],c,rl)});
    }
  }
  return out;
}

/* deep merge saved config over defaults so a spec/version bump that adds a
   key never wipes Tony's saved query. */
function mergeCfg(base,saved){
  if(!saved||typeof saved!=='object')return base;
  var out=Array.isArray(base)?base.slice():Object.assign({},base);
  if(Array.isArray(base))return Array.isArray(saved)?saved.slice():out;
  Object.keys(saved).forEach(function(k){
    var b=base[k],s=saved[k];
    if(b&&typeof b==='object'&&!Array.isArray(b)&&s&&typeof s==='object'&&!Array.isArray(s))
      out[k]=mergeCfg(b,s);
    else if(s!==undefined)out[k]=s;
  });
  return out;
}

var ADAPTERS={};

/* ---------------- adapters/mlb — LIVE ---------------- */
ADAPTERS.mlb=(function(){
  var API='https://statsapi.mlb.com/api/v1';
  function jget(u){
    return fetch(u).then(function(r){
      if(!r.ok)throw new Error(r.status+' '+u);
      return r.json();
    });
  }
  /* statsapi hitting/pitching line -> the §4.3 stat shape. Missing = null,
     never fabricated. */
  function bat(s){
    if(!s)return null;
    return{G:num(s.gamesPlayed),AB:num(s.atBats),PA:num(s.plateAppearances),H:num(s.hits),
      '2B':num(s.doubles),'3B':num(s.triples),HR:num(s.homeRuns),R:num(s.runs),
      RBI:num(s.rbi),BB:num(s.baseOnBalls),SO:num(s.strikeOuts),TB:num(s.totalBases)};
  }
  function pit(s){
    if(!s)return null;
    return{G:num(s.gamesPlayed),GS:num(s.gamesStarted),W:num(s.wins),L:num(s.losses),
      outs:num(s.outs),SO:num(s.strikeOuts),BB:num(s.baseOnBalls),H:num(s.hits),
      HR:num(s.homeRuns),IP:s.inningsPitched==null?null:String(s.inningsPitched)};
  }
  function num(v){return v==null||v===''?null:(isNaN(+v)?null:+v)}

  function fetchSlate(dstr,prog){
    prog=prog||function(){};

    prog('Schedule…');
    return jget(API+'/schedule?sportId=1&date='+dstr+'&hydrate=probablePitcher,lineups,venue(location)')
    .then(function(sched){
      var raw=(sched.dates&&sched.dates[0]&&sched.dates[0].games)||[];
      /* EMPTY SLATE is a legitimate state, not an error (off-day, All-Star
         break, bad date). Return the shell; the UI renders an honest empty. */
      if(!raw.length){slate.fetchedAt=new Date().toISOString();return slate}
      var lineupIds=[],needRoster=[];
      raw.forEach(function(g){
        var homeIds=((g.lineups&&g.lineups.homePlayers)||[]).map(function(x){return x.id});
        var awayIds=((g.lineups&&g.lineups.awayPlayers)||[]).map(function(x){return x.id});
        var gm={
          gameId:g.gamePk,
          away:{id:g.teams.away.team.id,fullName:g.teams.away.team.name},
          home:{id:g.teams.home.team.id,fullName:g.teams.home.team.name},
          venue:(g.venue&&g.venue.name)||null,
          /* FIX-1 §1.2 routing hooks need the venue's state */
          venueState:(g.venue&&g.venue.location&&g.venue.location.state)||null,
          venueStateAbbrev:(g.venue&&g.venue.location&&g.venue.location.stateAbbrev)||null,
          status:(g.status&&g.status.abstractGameState)||'',
          detailedState:(g.status&&g.status.detailedState)||'',
          gameDate:g.gameDate||null,
          probables:{away:(g.teams.away.probablePitcher&&g.teams.away.probablePitcher.id)||null,
                     home:(g.teams.home.probablePitcher&&g.teams.home.probablePitcher.id)||null},
          _awayIds:awayIds,_homeIds:homeIds,
          lineupPosted:{away:awayIds.length>0,home:homeIds.length>0},
        };
        if(!awayIds.length)needRoster.push([gm,'away']);
        if(!homeIds.length)needRoster.push([gm,'home']);
        slate.games.push(gm);
      });
      prog('Teams…');
      var teamIds=[];
      slate.games.forEach(function(g){
        [g.away.id,g.home.id].forEach(function(id){if(teamIds.indexOf(id)<0)teamIds.push(id)});
      });
      return jget(API+'/teams?teamIds='+teamIds.join(',')+'&sportId=1&hydrate=venue(location)').then(function(td){
        (td.teams||[]).forEach(function(t){
          slate.teams[t.id]={id:t.id,fullName:t.name,city:t.locationName||null,
            nickname:t.teamName||null,abbr:t.abbreviation||null,
            league:(t.league&&t.league.id)||null,seasonTotals:null,
            /* FIX-1 §1.2: the team's home state = its venue's state (full name +
               abbrev; Toronto yields ON, which simply matches no US state entity) */
            state:(t.venue&&t.venue.location&&t.venue.location.state)||null,
            stateAbbrev:(t.venue&&t.venue.location&&t.venue.location.stateAbbrev)||null};
        });
        slate.games.forEach(function(g){
          ['away','home'].forEach(function(sd){
            var t=slate.teams[g[sd].id];
            if(t){g[sd].city=t.city;g[sd].nickname=t.nickname;g[sd].abbr=t.abbr}
          });
        });
        /* §4.1 lineup fallback → active roster position players (keep TWP).
           Mirrors the app's rule so a pre-lineup slate still scans. */
        return seq(needRoster,function(pair){
          var g=pair[0],sd=pair[1];
          prog('Roster '+(g[sd].nickname||g[sd].fullName)+'…');
          return jget(API+'/teams/'+g[sd].id+'/roster?rosterType=active').then(function(r){
            g['_'+sd+'Ids']=(r.roster||[]).filter(function(x){
              return x.position.type!=='Pitcher'||x.position.abbreviation==='TWP';
            }).map(function(x){return x.person.id});
          }).catch(function(){g['_'+sd+'Ids']=[]});

      }).then(function(){
        var ids=[];
        slate.games.forEach(function(g){
          g._awayIds.concat(g._homeIds).forEach(function(id){if(ids.indexOf(id)<0)ids.push(id)});
          [g.probables.away,g.probables.home].forEach(function(id){
            if(id!=null&&ids.indexOf(id)<0)ids.push(id);
          });
        });
        var chunks=[];
        for(var i=0;i<ids.length;i+=50)chunks.push(ids.slice(i,i+50));
        return seq(chunks,function(chunk,ci){
          prog('Players '+Math.min((ci+1)*50,ids.length)+'/'+ids.length+'…');
          /* ONE call carries hitting AND pitching, career AND season
             (live-verified 2026-07-25). Two-way players return all four. */
          return jget(API+'/people?personIds='+chunk.join(',')+'&season='+season+
            '&hydrate=stats(group=[hitting,pitching],type=[career,season],season='+season+')')
          .then(function(d){

              var rec={
                id:pp.id,fullName:pp.fullName||'',
                firstName:pp.useName||(pp.fullName||'').split(' ')[0]||'',
                lastName:pp.useLastName||pp.lastName||(pp.fullName||'').split(' ').slice(-1)[0]||'',
                teamId:null,gameId:null,oppTeamId:null,side:null,
                pos:(pp.primaryPosition&&pp.primaryPosition.abbreviation)||'',
                isPitcher:false,isBatter:false,
                jersey:pp.primaryNumber?+pp.primaryNumber:null,
                dob:isISO(pp.birthDate)?pp.birthDate:null,
                /* FIX-1 §1.2: birth state hooks that state entity for THIS
                   player's card. statsapi gives the abbreviation ("CA");
                   ABBR2STATE resolves it to the registry's full name. A

      }).then(function(){

           FIX-1 §3 SPLITS — VERIFIED SYNTAX (live statsapi, 2026-07-25).
           Season:  hydrate=stats(group=[hitting],type=[statSplits],sitCodes=[h,a],season=YYYY)
           Career:  same call, type=[statSplits,careerStatSplits]
           VERIFIED RESPONSE SNIPPET (personId 592450 Aaron Judge):
             stats:[{type:{displayName:"statSplits"},group:{displayName:"hitting"},
               splits:[{season:"2026",split:{code:"h",description:"Home Games"},
                        stat:{gamesPlayed:26,hits:26,homeRuns:10,atBats:97,strikeOuts:33}},
                       {season:"2026",split:{code:"a",description:"Away Games"},
                        stat:{gamesPlayed:33,hits:27,homeRuns:7,atBats:117,...}}]},
              {type:{displayName:"careerStatSplits"},...
               splits:[{split:{code:"h"},stat:{gamesPlayed:596,hits:630,homeRuns:199,...}},
                       {split:{code:"a"},stat:{gamesPlayed:608,hits:628,...}}, <dupes>]}]
           QUIRKS ENCODED HERE (both live-verified):
           1. careerStatSplits rows arrive DUPLICATED (2x). Idempotent mapping
              by split.code absorbs that.
           2. With group=[hitting,pitching] in ONE call, careerStatSplits leaks
              the OTHER group's rows into each block (Ohtani group=hitting
              carried G=61/W=27 pitching rows beside G=557 hitting rows).
              Single-group calls are clean — Ohtani group=[hitting] only:
              h G=557 H=578 AB=2020 (no IP, no W) / a G=556 H=576 AB=2074.
              So hitting and pitching splits are fetched in SEPARATE calls.
           Failure of either call degrades that group's splits to null:
           Overall keeps working, split scopes read "unavailable" (§3.2).
        ============================================================ */
        function splitsCall(idList,group,assign){
          var chunks=[];
          for(var i=0;i<idList.length;i+=50)chunks.push(idList.slice(i,i+50));
          return seq(chunks,function(chunk,ci){
            prog('Splits '+group+' '+Math.min((ci+1)*50,idList.length)+'/'+idList.length+'…');
            return jget(API+'/people?personIds='+chunk.join(',')+'&season='+season+
              '&hydrate=stats(group=['+group+'],type=[statSplits,careerStatSplits],sitCodes=[h,a],season='+season+')')
            .then(function(d){
              (d.people||[]).forEach(function(pp){
                var rec=slate.players[pp.id];if(!rec)return;
                (pp.stats||[]).forEach(function(st){
                  var t=st.type&&st.type.displayName;
                  var scope=t==='statSplits'?'seasonSplits':(t==='careerStatSplits'?'careerSplits':null);
                  if(!scope)return;
                  (st.splits||[]).forEach(function(sp){
                    var code=sp.split&&sp.split.code;
                    var loc=code==='h'?'home':(code==='a'?'away':null);
                    if(!loc||!sp.stat)return;
                    assign(rec,scope,loc,sp.stat);
                  });
                });
              });
            }).catch(function(){/* this group's splits stay null — §3.2 degradation */});
          });
        }

        var pitchIds=allIds2.filter(function(id){
          var r=slate.players[id];return r.pitching&&(r.pitching.season||r.pitching.career);
        });
        return splitsCall(allIds2,'hitting',function(rec,scope,loc,stat){

          rec.batting[scope][loc]=bat(stat);
        }).then(function(){
          return splitsCall(pitchIds,'pitching',function(rec,scope,loc,stat){
            rec.pitching[scope]=rec.pitching[scope]||{home:null,away:null};
            rec.pitching[scope][loc]=pit(stat);

      }).then(function(){
        /* attach roles + team/game/opponent refs */
        slate.games.forEach(function(g){
          ['away','home'].forEach(function(sd){
            var opp=sd==='away'?'home':'away';
            g['_'+sd+'Ids'].forEach(function(id){

              p2.isPitcher=true;p2.isProbable=true;
              if(p2.pos==='TWP')p2.isBatter=true;
            }
          });

        prog('Team totals…');

        return seq(tids,function(id){
          return jget(API+'/teams/'+id+'/stats?stats=season&group=hitting&season='+season)
          .then(function(d){
            var s=d.stats&&d.stats[0]&&d.stats[0].splits&&d.stats[0].splits[0]&&d.stats[0].splits[0].stat;
            if(s)slate.teams[id].seasonTotals={R:num(s.runs),H:num(s.hits),HR:num(s.homeRuns),
              TB:num(s.totalBases),SO:num(s.strikeOuts),BB:num(s.baseOnBalls),
              AB:num(s.atBats),PA:num(s.plateAppearances)};
          }).catch(function(){/* staircases just absent for this team */});
        },6);
      }).then(function(){
        slate.games.forEach(function(g){delete g._awayIds;delete g._homeIds});
        slate.fetchedAt=new Date().toISOString();
        prog('');
        return slate;
      });
    });
  }
  return{id:'mlb',live:true,fetchSlate:fetchSlate};
})();

/* ---------------- adapters/wnba — PHANTOM (§4.2) ----------------
   Returns an empty slate and a "coming soon" state. NOTHING here calls

ADAPTERS.wnba={

      games:[],teams:{},players:{},phantom:true});

/* sequential runner with a small concurrency window — keeps the fetch
   polite and the progress line honest. */
function seq(items,fn,conc){
  conc=conc||1;
  var i=0,active=0,done=0;
  return new Promise(function(res,rej){
    if(!items.length)return res([]);
    function pump(){
      while(active<conc&&i<items.length){
        var idx=i++;active++;
        Promise.resolve(fn(items[idx],idx)).then(step,function(e){step()});
      }
    }
    function step(){active--;done++;if(done>=items.length)res();else pump()}
    pump();
  });
}
/* ============================================================
   9. THE ENGINE — pool x counters.

   The whole page is one idea: build a POOL of values (gematria of words,
   raw numbers, date figures) and a list of COUNTERS (things that count:
   stats, ages, spans, date figures), then intersect them. A match is
   equality. Nothing is scored, ranked, weighted or filtered beyond what
   Tony switched on (§0).

   Every match renders under the COUNTER that carries it, with the pool
   entry as its receipt — which is exactly the sacred card format (§7.2).
============================================================ */

/* ---- pool entry: {v, text, cipher, kind, label} ---- */
function poolAdd(out,v,text,cipher,kind,label){
  if(!(v>0))return;
  out.push({v:v,text:text,cipher:cipher||null,kind:kind,label:label||null});
}
function addCiphered(out,text,kind,ciphers,label){
  if(!text)return;
  var vals=calcAll(text);
  for(var i=0;i<ALL_CIPHERS.length;i++){
    var c=ALL_CIPHERS[i];
    if(ciphers[c])poolAdd(out,vals[c],text,c,kind,label);
  }
}

/* §6.3 sibling-cipher dedupe. DEFAULT OFF (both show). When ON, pool
   entries with the SAME text and SAME value collapse to one line whose
   cipher label is the combined list ("Ord/Sat"). Never drops a value —
   only merges identical claims about the same word. */
function dedupePool(pool,on){
  if(!on)return pool;
  var by={},out=[];
  pool.forEach(function(e){
    var k=e.kind+'|'+e.text+'|'+e.v;
    if(by[k]){if(e.cipher&&by[k].ciphers.indexOf(e.cipher)<0)by[k].ciphers.push(e.cipher);return}
    var c=Object.assign({},e);c.ciphers=e.cipher?[e.cipher]:[];
    by[k]=c;out.push(c);
  });
  return out;
}

/* ---------- POOL (value sources) ---------- */
function buildPool(p,ctx){
  var cfg=ctx.cfg,ciphers=cfg.ciphers,out=[];
  var team=ctx.slate.teams[p.teamId]||{},opp=ctx.slate.teams[p.oppTeamId]||{};
  var S=cfg.simple;
  if(S.pName) addCiphered(out,p.fullName,'pName',ciphers);
  if(S.pFirst)addCiphered(out,p.firstName,'pFirst',ciphers);
  if(S.pLast) addCiphered(out,p.lastName,'pLast',ciphers);
  if(S.tName) addCiphered(out,team.fullName,'tName',ciphers);
  if(S.tLoc)  addCiphered(out,team.city,'tLoc',ciphers);
  if(S.tMascot)addCiphered(out,team.nickname,'tMascot',ciphers);
  if(S.oName) addCiphered(out,opp.fullName,'oName',ciphers);
  if(S.oLoc)  addCiphered(out,opp.city,'oLoc',ciphers);
  if(S.oMascot)addCiphered(out,opp.nickname,'oMascot',ciphers);
  if(S.jersey&&p.jersey!=null)poolAdd(out,p.jersey,'jersey #'+p.jersey,null,'jersey');

  /* §6.5 Direct Phrase Matching — the day's theme lives here. */
  if(cfg.types.custom){
    cfg.custom.phrases.forEach(function(ph){addCiphered(out,ph,'phrase',ciphers)});
    /* §6.5 Enhanced Match Type Filtering — composition grid. */
    cfg.custom.compose.forEach(function(c){
      if(!c||!c.word)return;
      var base=composeField(c.field,p,team,opp);
      if(!base)return;
      addCiphered(out,(base+' '+c.word).trim(),'compose',ciphers);
    });
  }
  /* §6.6 date-calc values also act as a SOURCE (they are an explicit value
     source in §6.8's Stat Matching list). They still act as counters too —
     the self-match is excluded in matchCounter(). */
  /* the cipher is NOT baked into the text — renderLine prints it as the
     receipt's label, and embedding it here printed it twice. */
  if(cfg.types.date)ctx.dateVals.forEach(function(d){
    var e={v:d.n,text:d.word||d.label,cipher:d.cipher,kind:'date',
      label:d.label,calc:d.calc};
    if(e.v>0)out.push(e);
  });
  /* §6.8 free-entry thread numbers. */
  if(cfg.types.stat&&cfg.stat.sources.raw)ctx.rawNums.forEach(function(n){
    poolAdd(out,n,'number '+n,null,'raw');
  });
  /* §6.7 age figures as a source (§6.8 lists "Player Age figures"). */
  if(cfg.types.age&&ctx.clockOf(p))ageFigures(p,ctx).forEach(function(a){
    poolAdd(out,a.value,a.label+' '+a.value,null,'age',a.detail);
  });
  /* Phase 2 sources are appended by their engines (founders spans /
     entity gematria / career clocks) — see PHASE2_POOL below. */
  PHASE2_POOL.forEach(function(fn){fn(out,p,ctx)});
  return dedupePool(out,cfg.dedupeSiblings);
}
var PHASE2_POOL=[];
/* pool entries that do NOT vary by player — built once per scan. */
var PHASE2_SHARED_POOL=[];
function sharedPool(ctx){
  if(ctx._shared)return ctx._shared;
  var out=[];
  PHASE2_SHARED_POOL.forEach(function(fn){fn(out,ctx)});
  ctx._shared=dedupePool(out,ctx.cfg.dedupeSiblings);
  ctx._sharedByValue={};
  ctx._shared.forEach(function(e){
    (ctx._sharedByValue[e.v]=ctx._sharedByValue[e.v]||[]).push(e);
  });
  return ctx._shared;
}
function sharedByValue(ctx){sharedPool(ctx);return ctx._sharedByValue}

function composeField(field,p,team,opp){
  switch(field){
    case'pName':return p.fullName; case'pFirst':return p.firstName; case'pLast':return p.lastName;
    case'tName':return team.fullName; case'tLoc':return team.city; case'tMascot':return team.nickname;
    case'oName':return opp.fullName; case'oLoc':return opp.city; case'oMascot':return opp.nickname;
  }
  return null;
}

/* ---------- age / birthday figures (§6.7) ---------- */
function ageFigures(p,ctx){
  var ck=ctx.clockOf(p);
  if(!ck)return[];
  var L=ctx.cfg.age.lanes,out=[];
  /* Exact-match-only: when ON the lane only participates if the figure is
     exact (no remainder). OFF = the floor figure matches (§6.7). */
  if(L.days.on)out.push({key:'days',label:'Total age (days)',value:ck.totalDays,
    detail:ck.years+'y '+ck.since+'d'});
  if(L.weeks.on&&(!L.weeks.exact||ck.weekRem===0))
    out.push({key:'weeks',label:'Total age (weeks)',value:ck.weeks,
      detail:ck.weeks+'w '+ck.weekRem+'d'+(L.weeks.exact?' · exact':'')});
  if(L.months.on&&(!L.months.exact||ck.monthRem===0))
    out.push({key:'months',label:'Total age (months)',value:ck.months,
      detail:ck.months+'mo '+ck.monthRem+'d'+(L.months.exact?' · exact':'')});
  return out;
}
function bdayFigures(p,ctx){
  var ck=ctx.clockOf(p);
  if(!ck)return[];
  var L=ctx.cfg.age.lanes,out=[];
  if(L.bdaySince.on)out.push({key:'since',label:'Days after last birthday',value:ck.since,
    detail:'birthday '+p.dob});
  if(L.bdayUntil.on)out.push({key:'until',label:'Days before next birthday',value:ck.until,
    detail:'birthday '+p.dob});
  return out;
}

/* ---------- COUNTERS ---------- */
/* counter: {group, gid, label, value, detail, arith, accepts} where
   `accepts` is the set of pool kinds allowed to test against it. */
function buildCounters(p,ctx){
  var cfg=ctx.cfg,out=[];
  var nameKinds=['pName','pFirst','pLast','tName','tLoc','tMascot','oName','oLoc','oMascot','compose'];

  /* §6.6 date calcs as counters (names/phrases -> date calcs). */
  if(cfg.types.date){
    /* accepts is a KIND MAP, not an array: matchCounter does one lookup per
       candidate hit and a maximal query produces millions of them, so an
       indexOf() scan here is the difference between 70ms and 1.3s. */
    var accept={};
    if(cfg.date.namesToDate){
      if(cfg.date.pools.pName)accept.pName=true;
      if(cfg.date.pools.pFirst)accept.pFirst=true;
      if(cfg.date.pools.pLast)accept.pLast=true;
      if(cfg.date.pools.phrase){accept.phrase=true;accept.compose=true}
    }
    if(cfg.date.bdayToDate)accept.bdaySpan=true;
    ctx.dateVals.forEach(function(d){
      out.push({group:'date',gid:'date-'+d.id+'-'+(d.cipher||'')+'-'+d.n,
        label:d.label,value:d.n,detail:d.calc,accepts:accept});
    });
  }
  /* §6.7 age + birthday spans as counters. */
  if(cfg.types.age){
    var t=cfg.age.targets,acc={};
    if(t.name)nameKinds.forEach(function(k){acc[k]=true});
    if(t.phrase)acc.phrase=true;
    if(t.date)acc.date=true;
    acc.raw=true;
    /* 6.9: entity spans are "testable against ... birthday spans" — that is
       this direction, so founders / career-clock / entity values are always
       eligible against an age or birthday counter. */
    acc.founders=true;acc.clock=true;acc.entity=true;
    ageFigures(p,ctx).forEach(function(a){
      out.push({group:'age',gid:'age-'+a.key,label:a.label,value:a.value,
        detail:a.detail,accepts:acc});
    });
    bdayFigures(p,ctx).forEach(function(a){
      out.push({group:'bday',gid:'bday-'+a.key,label:a.label,value:a.value,
        detail:a.detail,accepts:acc});
    });
  }
  /* §6.8 stat counters, with Current / Next / Custom modes. */
  if(cfg.types.stat){
    var sacc=statAccepts(cfg);
    if(p.isBatter)pushStatCounters(out,cfg.stat.bat,BAT_STATS,p.batting,'Batting',sacc,p);
    if(p.isPitcher)pushStatCounters(out,cfg.stat.pit,PIT_STATS,p.pitching,'Pitching',sacc,p);
  }
  /* Phase 2 counters (founders spans / career clocks / team totals). */
  PHASE2_COUNTERS.forEach(function(fn){fn(out,p,ctx)});
  return out;
}
var PHASE2_COUNTERS=[];

function statAccepts(cfg){
  var s=cfg.stat.sources,acc={};
  if(s.phrase){acc.phrase=true;acc.compose=true}
  if(s.date)acc.date=true;
  if(s.pName){acc.pName=true;acc.pFirst=true;acc.pLast=true}
  if(s.tName){acc.tName=true;acc.tLoc=true;acc.tMascot=true}
  if(s.oName){acc.oName=true;acc.oLoc=true;acc.oMascot=true}
  if(s.age)acc.age=true;
  if(s.jersey)acc.jersey=true;
  if(s.raw)acc.raw=true;
  /* Phase 2 pool kinds are always eligible against stats — §6.9 states
     founders spans are "testable against player stats" explicitly. */
  acc.founders=true;acc.clock=true;acc.entity=true;
  return acc;
}
/* §7.2: Custom-offset stats show their arithmetic ("59 + 3 = 62"). */
/* FIX-1 3.2: resolve a lane's stat source for its configured scope.
   'venue' auto-resolves to home or away from where this player's game is
   (p.side) -- the scope Tony actually uses pregame. Missing splits: null,
   the lane contributes nothing, zero errors (3.2 degradation). */
function statScopeSrc(stats,scope,laneScope,p){
  if(!stats)return{src:null,tag:null};
  if(!laneScope||laneScope==='overall')return{src:stats[scope],tag:null};
  var loc=laneScope==='venue'?(p&&p.side==='home'?'home':'away'):laneScope;
  var sp=stats[scope+'Splits'];
  return{src:(sp&&sp[loc])||null,
    tag:laneScope==='venue'?'venue·'+loc:loc};
}
function pushStatCounters(out,conf,table,stats,role,acc,p){
  ['season','career'].forEach(function(scope){
    table.forEach(function(row){
      var label=row[0],key=row[1],c=conf[scope+'-'+key];
      if(!c||!c.on)return;
      var rs=statScopeSrc(stats,scope,c.scope,p);
      var src=rs.src;
      if(!src)return;
      var base=src[key];
      /* §6.8: zero-value stats are skipped for the other role (a pitcher's
         empty batting line produces no counters). null = never fabricated. */
      if(base==null||!(base>0))return;
      var off=c.mode==='current'?0:(c.mode==='next'?1:Math.round(+c.off||0));
      var val=base+off;
      if(!(val>0))return;
      var arith=off===0?null:base.toLocaleString()+' '+(off<0?'-':'+')+' '+Math.abs(off)+' = '+val.toLocaleString();
      /* FIX-1 3.2: receipts NAME non-overall scopes -- "Season H (home)" */
      out.push({group:'stat',gid:'stat-'+scope+'-'+key+'-'+role+(rs.tag?'-'+rs.tag:''),
        label:cap(scope)+' '+role+' '+label+(rs.tag?' ('+rs.tag+')':'')+
          (off===0?'':(off===1?' (next)':' '+(off<0?'':'+')+off)),
        value:val,detail:null,arith:arith,accepts:acc,
        statKey:key,splitScope:rs.tag});
    });
  });
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}

/* ---------- §8 index chaining ---------- */
/* d1 = direct only. d2 = counter value's prime/composite index joins the
   pool test for that counter. d3 = one more indexing step. Chained hits
   carry the full chain text and a depth chip — NEVER masquerade as direct. */
/* chainSteps is called once per counter per scan; at maximal settings that is
   hundreds of thousands of calls over a small set of distinct values, so the
   result is memoized per (value, depth). Cleared on every scan. */
var _chainMemo={depth:-1,map:null};
function chainSteps(value,depth){
  if(_chainMemo.depth!==depth){_chainMemo={depth:depth,map:{}}}
  var hit=_chainMemo.map[value];
  if(hit)return hit;
  return(_chainMemo.map[value]=chainStepsRaw(value,depth));
}
function chainStepsRaw(value,depth){
  var steps=[{v:value,depth:1,text:null}];
  if(depth<2)return steps;
  var cur=value;
  for(var d=2;d<=depth;d++){
    var pi=primeIndex(cur),ci=pi>0?-1:compositeIndex(cur);
    var nv,lbl;
    if(pi>0){nv=pi;lbl=cur.toLocaleString()+' = prime #'+pi}
    else if(ci>0){nv=ci;lbl=cur.toLocaleString()+' = composite #'+ci}
    else break;             /* 0/1/out-of-sieve → chain simply stops */
    var prev=steps[steps.length-1];
    steps.push({v:nv,depth:d,text:(prev.text?prev.text+' → ':'')+lbl});
    cur=nv;
  }
  return steps;
}
var CHAIN_DEPTH={off:0,d1:1,d2:2,d3:3};

/* ---------- match one counter against the pool ---------- */
/* `maps` is one value-map or an array of them. Player-independent pool
   entries (founders spans, entity gematria) live in a SHARED map built once
   per scan instead of being rebuilt for all 400+ players — same entries, same
   matches, a fraction of the allocation. */
function matchCounter(counter,maps,depth){
  var hits=[];
  if(depth<1)return hits;
  if(!Array.isArray(maps))maps=[maps];
  var steps=chainSteps(counter.value,depth);
  for(var s=0;s<steps.length;s++){
    var st=steps[s];
    for(var m=0;m<maps.length;m++){
    var bucket=maps[m][st.v];
    if(!bucket)continue;
    for(var i=0;i<bucket.length;i++){
      var e=bucket[i];
      if(!counter.accepts[e.kind])continue;
      /* a counter never matches a pool entry of its own family — a date calc
         equalling itself, or an entity span equalling its own span, is a
         tautology, not a convergence. */
      if(e.kind==='date'&&counter.group==='date')continue;
      if(e.kind==='age'&&(counter.group==='age'||counter.group==='bday'))continue;
      if(e.kind==='founders'&&counter.group==='founders'&&e.entityKey===counter.entityKey)continue;
      if(e.kind==='clock'&&counter.group==='clock')continue;
      hits.push({entry:e,depth:st.depth,chain:st.text,value:st.v});
    }
    }
  }
  return hits;
}

/* ---------- scan ---------- */
function makeCtx(slate,cfg,founders){
  var dateVals=cfg.types.date?dateCalcs(slate.date,cfg.date.formulas,cfg.ciphers):[];
  var rawNums=parseNums(cfg.stat.raw);
  var clockCache={};
  var ctx={
    slate:slate,cfg:cfg,founders:founders||null,
    dateVals:dateVals,rawNums:rawNums,
    depth:CHAIN_DEPTH[cfg.chain]||1,
    clockOf:function(p){
      if(!p.dob)return null;                      /* no DOB → no age matches, no error */
      var k=p.id+'|'+slate.date+'|'+(cfg.age.inclusive?1:0);
      if(!(k in clockCache))clockCache[k]=clockFrom(p.dob,slate.date,cfg.age.inclusive);
      return clockCache[k];
    },
  };
  return ctx;
}
function parseNums(s){
  if(!s)return[];
  var out=[];
  String(s).split(/[^0-9]+/).forEach(function(t){
    if(!t)return;var n=+t;if(n>0&&out.indexOf(n)<0)out.push(n);
  });
  return out;
}

/* scanPlayer -> {player, groups:[{group,label,value,...,lines:[]}], count, flags} */
function scanPlayer(p,ctx){
  var pool=buildPool(p,ctx);
  var byValue={};
  pool.forEach(function(e){(byValue[e.v]=byValue[e.v]||[]).push(e)});
  /* §6.6 direction 2: birthday spans as a POOL kind so they can hit date
     calcs. Added after byValue so they never self-match a bday counter. */
  /* 6.9 lists birthday spans as a target for founders spans UNCONDITIONALLY,
     so the pool entry is gated only by its own section (Player Total Age).
     Whether DATE CALCS may consume it stays governed by the 6.6 direction
     toggle, which lives on the date counter's accepts map (see buildCounters). */
  if(ctx.cfg.types.age){
    bdayFigures(p,ctx).forEach(function(b){
      var e={v:b.value,text:b.label.toLowerCase()+' = '+b.value,cipher:null,
        kind:'bdaySpan',label:b.detail};
      if(e.v>0)(byValue[e.v]=byValue[e.v]||[]).push(e);
    });
  }
  var counters=buildCounters(p,ctx);
  var maps=[byValue,sharedByValue(ctx)];
  var groups=[],count=0;
  counters.forEach(function(c){
    var hits=matchCounter(c,maps,ctx.depth);
    count+=hits.length;
    groups.push({counter:c,hits:hits});
  });
  return{player:p,groups:groups,count:count,flags:playerFlags(p,ctx),
    pool:pool.concat(sharedPool(ctx))};
}

/* §6.1 "Jersey Birthday Match" — jersey equals a DOB day/month figure.
   Rendered as an explicit flag line, not a silent value (it is a claim
   about the player, and claims get receipts). */
function playerFlags(p,ctx){
  var out=[];
  if(ctx.cfg.simple.jerseyBday&&p.jersey!=null&&p.dob){
    var m=+p.dob.slice(5,7),d=+p.dob.slice(8,10);
    var tests=[[d,'DOB day '+d],[m,'DOB month '+m],[m+d,'DOB month+day '+m+'+'+d],
               [+(''+m+d),'DOB concat '+m+'/'+d]];
    tests.forEach(function(t){
      if(t[0]===p.jersey)out.push({kind:'jerseyBday',
        text:'⚑ jersey #'+p.jersey+' = '+t[1]});
    });
  }
  PHASE2_FLAGS.forEach(function(fn){fn(out,p,ctx)});
  return out;
}
var PHASE2_FLAGS=[];

/* full-slate scan — pure computation over the cached slate (§4.1). */
function scanSlate(slate,cfg,founders){
  var ctx=makeCtx(slate,cfg,founders);
  var out=[];
  var ids=Object.keys(slate.players);
  for(var i=0;i<ids.length;i++){
    var p=slate.players[ids[i]];
    if(!includePlayer(p,cfg))continue;
    out.push(scanPlayer(p,ctx));
  }
  return{results:out,ctx:ctx};
}
function includePlayer(p,cfg){
  if(p.teamId==null||p.gameId==null)return false;
  if(cfg.games.length&&cfg.games.indexOf(p.gameId)<0)return false;
  /* §5.7 two-way players appear under BOTH filters. */
  if(cfg.position==='bat'&&!p.isBatter)return false;
  if(cfg.position==='pit'&&!p.isPitcher)return false;
  return true;
}

/* ============================================================
   11. RENDER HELPERS
============================================================ */
function h(tag,attrs,kids){
  var el=document.createElement(tag);
  if(attrs)Object.keys(attrs).forEach(function(k){
    var v=attrs[k];
    if(v==null||v===false)return;
    if(k==='class')el.className=v;
    else if(k==='text')el.textContent=v;
    else if(k==='html')el.innerHTML=v;
    else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='style'&&typeof v==='object')Object.assign(el.style,v);
    else el.setAttribute(k,v===true?'':v);
  });
  (kids||[]).forEach(function(c){
    if(c==null||c===false)return;
    el.appendChild(typeof c==='string'?document.createTextNode(c):c);
  });
  return el;
}
function clear(el){while(el.firstChild)el.removeChild(el.firstChild)}
function toast(msg,actionLabel,action){
  var host=document.getElementById('toastHost');
  clear(host);
  var t=h('div',{class:'toast'},[h('span',{text:msg}),
    actionLabel?h('button',{text:actionLabel,onclick:function(){clear(host);action&&action()}}):null]);
  host.appendChild(t);
  setTimeout(function(){if(t.parentNode===host)host.removeChild(t)},5200);
}
function fmt(n){return n==null?'—':Number(n).toLocaleString()}
function countOn(o){return Object.keys(o||{}).filter(function(k){return o[k]}).length}

    [h('span',{text:typesOn+' type'+(typesOn===1?'':'s')+' selected'}),h('span',{class:'cnt',text:'Configure ›'})])));

function fld(label,ctl){return h('div',{class:'fld'},[h('div',{class:'fld-label',text:label}),ctl])}
function segBtn(label,on,fn){return h('button',{class:on?'on':'',text:label,onclick:fn})}
function currentDate(){return A.cfg.dateStr||(A.slate&&A.slate.date)||todayISO()}

function renderGameFilter(){
  if(!A.slate||!A.slate.games.length)
    return h('div',{class:'hint',text:A.slate?'no games on this date':'run a scan to list games'});
  var C=A.cfg;
  var wrap=h('div',{class:'gamelist'});
  wrap.appendChild(h('label',{},[
    h('input',{type:'checkbox',checked:C.games.length===0?true:null,onchange:function(){C.games=[];onChange()}}),
    h('span',{text:'All games ('+A.slate.games.length+')'})]));
  A.slate.games.forEach(function(g){
    wrap.appendChild(h('label',{},[
      h('input',{type:'checkbox',checked:C.games.indexOf(g.gameId)>=0?true:null,
        onchange:function(e){
          var i=C.games.indexOf(g.gameId);
          if(e.target.checked&&i<0)C.games.push(g.gameId);
          else if(!e.target.checked&&i>=0)C.games.splice(i,1);
          onChange();
        }}),
      h('span',{text:(g.away.abbr||g.away.fullName)+' @ '+(g.home.abbr||g.home.fullName)}),
    ]));
  });
  return wrap;
}

function renderTypeahead(){
  var wrap=h('div',{class:'fld ta-wrap'});
  wrap.appendChild(h('div',{class:'fld-label',text:'Player'}));
  var cur=A.slate&&A.cfg.individualId!=null&&A.slate.players[A.cfg.individualId];
  var inp=h('input',{class:'ctl',type:'text',placeholder:'type a name…',
    value:cur?cur.fullName:'',
    oninput:function(e){showTA(e.target.value)},
    onfocus:function(e){showTA(e.target.value)}});
  wrap.appendChild(inp);
  var list=h('div',{class:'ta-list',style:{display:'none'}});
  wrap.appendChild(list);
  function showTA(q){
    clear(list);
    if(!A.slate){list.style.display='none';return}
    q=(q||'').trim().toLowerCase();
    var hits=[];
    Object.keys(A.slate.players).forEach(function(id){
      var p=A.slate.players[id];
      if(p.teamId==null)return;
      if(q&&normText(p.fullName).toLowerCase().indexOf(q)<0)return;
      hits.push(p);
    });
    hits.sort(function(a,b){return a.fullName<b.fullName?-1:1});
    if(!hits.length){list.style.display='none';return}
    hits.slice(0,40).forEach(function(p){
      var t=A.slate.teams[p.teamId]||{};
      list.appendChild(h('button',{onclick:function(){
        A.cfg.individualId=p.id;list.style.display='none';onChange();
      }},[h('div',{text:p.fullName}),
          h('div',{class:'sub',text:(t.abbr||'')+' · '+(p.pos||'')+(p.dob?' · '+p.dob:' · no DOB')})]));
    });
    list.style.display='block';
  }
  return wrap;
}

function setDate(d){
  if(!isISO(d))return;
  A.cfg.dateStr=d;saveCfg();
  A.slate=null;A.results=[];A.scanned=false;
  render();
  loadSlate(d);
}
function switchSport(s){
  if(!SPORT_PROFILES[s])return;
  saveCfg();
  A.sport=s;
  A.cfg=mergeCfg(defaultConfig(s),lsGet(LS.cfg+s,null));
  A.cfg.sport=s;
  A.work=mergeCfg({hiddenWords:[],hiddenFamilies:[],spotlight:'',
    probes:{},openProbes:{},collapsed:{}},lsGet(LS.work+s,null));
  A.slate=null;A.results=[];A.scanned=false;A.error=null;
  persistRail();                 /* the sport IS rail state — save it now */
  render();
  loadSlate(currentDate());
}

/* ============================================================
   13. PRESETS (§5.2) — a preset captures the ENTIRE query config.
============================================================ */
var PRESET_KEYS=['types','simple','ciphers','dedupeSiblings','chain','position','games',
  'sort','custom','date','age','stat','founders','clocks','teamTotals','card','mode'];
function savePreset(){
  var n=prompt('Preset name');
  if(!n)return;
  n=n.trim();if(!n)return;
  var ps=lsGet(presetKey(),{}),snap={};
  PRESET_KEYS.forEach(function(k){snap[k]=JSON.parse(JSON.stringify(A.cfg[k]))});
  snap._sport=A.sport;
  ps[n]=snap;
  if(lsSet(presetKey(),ps))toast('Preset "'+n+'" saved');
  render();
}
function loadPreset(n){
  var ps=lsGet(presetKey(),{}),snap=ps[n];
  if(!snap)return;
  /* §5.2 presets are PER-SPORT — a preset saved under MLB never loads under
     WNBA. The storage key is already sport-scoped; this is the belt. */
  if(snap._sport&&snap._sport!==A.sport){toast('Preset "'+n+'" belongs to '+snap._sport.toUpperCase());return}
  PRESET_KEYS.forEach(function(k){if(snap[k]!==undefined)A.cfg[k]=JSON.parse(JSON.stringify(snap[k]))});
  toast('Preset "'+n+'" loaded');
  onChange();
}

function bulkApply(){
  var m=prompt('Bulk apply mode to all ENABLED stats:\n  current | next | <number offset>','next');
  if(m==null)return;
  m=String(m).trim().toLowerCase();
  var mode,off=1;
  if(m==='current')mode='current';
  else if(m==='next')mode='next';
  else if(/^-?\d+$/.test(m)){mode='custom';off=+m}
  else{toast('Not a mode: '+m);return}
  [A.cfg.stat.bat,A.cfg.stat.pit,A.cfg.teamTotals].forEach(function(conf){
    Object.keys(conf).forEach(function(k){
      if(conf[k].on){conf[k].mode=mode;if(mode==='custom')conf[k].off=off}
    });
  });
  onChange();renderDialog();
  toast('Bulk applied: '+m);
}
